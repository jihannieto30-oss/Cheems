    const mono = base('monospace'), serif = base('serif');
    let hit = null;
    for (const f of PROBE_ORDER) {
      const w = base('"' + f + '",monospace'), w2 = base('"' + f + '",serif');
      if (Math.abs(w - mono) > 0.5 && Math.abs(w - w2) < 0.5) { hit = f; break; }
    }
    _resolved = { family: hit, substituted: !hit || PROBE_ORDER.indexOf(hit) > 4, stack: STACK.display };
    return _resolved;
  }

  /** Cap-height ratio of the resolved face, so `capPx` is exact for any font. */
  function capRatio(weight) {
    const k = 'w' + weight;
    if (_capRatio[k]) return _capRatio[k];
    const cv = document.createElement('canvas'); cv.width = 400; cv.height = 300;
    const c = cv.getContext('2d');
    c.font = weight + ' 200px ' + STACK.display;
    const m = c.measureText('H');
    let r = (m.actualBoundingBoxAscent || 140) / 200;
    if (!(r > 0.4 && r < 0.95)) r = 0.715;
    _capRatio[k] = r;
    return r;
  }

  return {
    STACK, PALETTE, CATALOG, productsOf, skuInfo, allSkus, APPROVED_COMPOUNDS,
    LEGAL_LINE, Policy, resolveFont, capRatio
  };
})();

/* ============================================================================
   package: @px/engine-render
   render() is a PURE function of (master, document, options).
   It emits a resolution-independent display list; concrete renderers
   (Canvas for the viewport / PNG, SVG for vector output) consume it.
   Nothing here may write to a master.
   depends on: core-model, brand
   ============================================================================ */
const ENGINE = (() => {
  'use strict';

  /* ---- measurement service (deterministic given the resolved face) ----- */
  const _mc = document.createElement('canvas').getContext('2d');
  const fontStr = (w, size) => w + ' ' + size.toFixed(3) + 'px ' + BRAND.STACK.display;

  /**
   * Lay text out glyph-by-glyph so Canvas and SVG produce identical geometry
   * and tracking is exact regardless of engine letter-spacing support.
   */
  function layout(text, ty, maxW, align) {
    const chars = [...String(text)];
    if (!chars.length) return null;
    const ratio = BRAND.capRatio(ty.weight);
    let size = ty.capPx / ratio;
    const build = (sz) => {
      const sp = ty.tracking * sz;
      _mc.font = fontStr(ty.weight, sz);
      const ws = chars.map(c => _mc.measureText(c).width);
      const total = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
      return { ws, sp, total, sz };
    };
    let L = build(size);
    if (maxW && L.total > maxW) { size *= maxW / L.total; L = build(size); }
    let x = ty.anchor;
    if (align === 'center') x = ty.anchor - L.total / 2;
    else if (align === 'right') x = ty.anchor - L.total;
    const out = [];
    for (let i = 0; i < chars.length; i++) { out.push({ ch: chars[i], x }); x += L.ws[i] + L.sp; }
    return { glyphs: out, size: L.sz, width: L.total, capPx: ty.capPx * (L.sz / (ty.capPx / ratio)), weight: ty.weight, baseline: ty.baseline };
  }

  function textPrim(value, def, opts) {
    const ty = def.typography;
    const L = layout(value, ty, def.fit === 'fixed' ? 0 : def.frame.w, def.align);
    if (!L) return null;
    return {
      t: 'glyphs', slot: def.key, chars: L.glyphs, y: ty.baseline, size: L.size,
      weight: ty.weight, capPx: L.capPx, width: L.width,
      fill: opts.fill, effect: opts.effect || null, frame: def.frame
    };
  }

  /* free-standing (non-slot) label text on the generated data panel */
  function label(text, o) {
    const ty = { capPx: o.capPx, anchor: o.anchor, baseline: o.baseline, tracking: o.tracking, weight: o.weight || 400 };
    const L = layout(text, ty, o.maxW || 0, o.align || 'center');
    if (!L) return null;
    return { t: 'glyphs', chars: L.glyphs, y: o.baseline, size: L.size, weight: ty.weight, capPx: L.capPx, width: L.width, fill: o.fill, effect: null };
  }

  const rule = (x1, x2, y, c, w) => ({ t: 'line', x1, y1: y, x2, y2: y, stroke: c, w: w || 1 });

  /* ---- QR ------------------------------------------------------------- */
  function qrPrim(text, def, pal) {
    let m = null;
    try { m = QRGen.matrix(text); } catch (e) { return { t: 'qrfail', frame: def.frame, msg: e.message }; }
    const n = m.length, quiet = 4, total = n + quiet * 2;
    const mod = def.frame.w / total;
    return {
      t: 'qr', slot: 'qr', m, n, quiet, mod,
      x: def.frame.x, y: def.frame.y, size: def.frame.w,
      dark: pal.qrDark, light: pal.qrLight,
      moduleMM: CORE.px2mm(mod)
    };
  }

  /* ---- default derivations -------------------------------------------- */
  function qrPayload(doc) {
    if (doc.bindings.qr) return doc.bindings.qr;
    const s = doc.bindings.serial || doc.bindings.lot || doc.sku || 'PX';
    return 'https://peptidex.netlify.app/#/verify/' + encodeURIComponent(s);
  }

  /* ============================ render() ================================ */
  /**
   * @returns {{artboards: Array}} a pure display list. No DOM, no side effects.
   */
  function render(master, doc, options) {
    const o = Object.assign({ artboards: ['front', 'back'], bleedMM: 0 }, options || {});
    const pal = BRAND.PALETTE[master.line];
    const B = pal.back;
    const out = [];

    /* ---------- FRONT: immutable master + variable-data overlay -------- */
    if (o.artboards.indexOf('front') >= 0 && doc.artboards.front) {
      const p = [];
      p.push({ t: 'image', master: master.id, x: 0, y: 0, w: CORE.PLATE_W, h: CORE.PLATE_H, layer: 'master' });

      const embossScale = (cap) => cap / 35;
      const fx = (kind, cap) => {
        const s = embossScale(cap);
        if (kind === 'deboss') return { hi: { dx: 1.1 * s, dy: 1.5 * s, a: 0.55 }, lo: { dx: -0.9 * s, dy: -1.1 * s, a: 0.32 } };
        if (kind === 'none') return null;
        return { lo: { dx: 1.1 * s, dy: 1.5 * s, a: 0.55 }, hi: { dx: -0.9 * s, dy: -1.1 * s, a: 0.30 } };
      };
      const finishKind = doc.finishes.compound === 'auto' ? pal.bandFinish : doc.finishes.compound;

      const cDef = CORE.slotDef('compound');
      const cVal = doc.bindings.compound;
      if (cVal) {
        const pr = textPrim(cVal, cDef, { fill: pal.bandInk, effect: fx(finishKind, cDef.typography.capPx) });
        if (pr) { pr.layer = 'overlay'; p.push(pr); }
      }
      const dDef = CORE.slotDef('dosage');
      if (doc.bindings.dosage) {
        const pr = textPrim(doc.bindings.dosage, dDef, { fill: pal.doseInk, effect: null });
        if (pr) { pr.layer = 'overlay'; p.push(pr); }
      }
      out.push({
        id: 'front', label: 'FRONT · MASTER', w: CORE.PLATE_W, h: CORE.PLATE_H,
        prims: p, source: 'master', masterId: master.id, grade: master.graded,
        bg: pal.panel, vector: false
      });
    }

    /* ---------- BACK: generated vector data panel ---------------------- */
    if (o.artboards.indexOf('back') >= 0 && doc.artboards.back) {
      const p = [];
      const W = CORE.PLATE_W, H = CORE.PLATE_H, L = 46, R = 420;
      p.push({ t: 'rect', x: 0, y: 0, w: W, h: H, fill: B.bg, layer: 'master' });
      p.push(label(pal.name, { capPx: 16, anchor: 233, baseline: 44, tracking: 0.34, fill: B.ink2, weight: 500 }));
      p.push(rule(L, R, 64, B.rule, 1));

      p.push(label('COMPOUND', { capPx: 16, anchor: L, baseline: 110, tracking: 0.28, fill: B.ink2, align: 'left' }));
      const cv = doc.bindings.compound || '—';
      p.push(label(cv, { capPx: 30, anchor: L, baseline: 152, tracking: 0.06, fill: B.ink, weight: 600, align: 'left', maxW: R - L }));
      p.push(rule(L, R, 178, B.rule, 1));

      p.push(label('DOSAGE', { capPx: 16, anchor: L, baseline: 214, tracking: 0.28, fill: B.ink2, align: 'left' }));
      p.push(label(doc.bindings.dosage || '—', { capPx: 22, anchor: L, baseline: 250, tracking: 0.10, fill: B.ink, weight: 500, align: 'left', maxW: R - L }));
      p.push(rule(L, R, 276, B.rule, 1));

      const on = k => doc.enabled[k] !== false;

      if (on('lot')) {
        p.push(label('LOT / BATCH', { capPx: 16, anchor: L, baseline: 312, tracking: 0.28, fill: B.ink2, align: 'left' }));
        const d = CORE.slotDef('lot');
        const pr = textPrim(doc.bindings.lot || '—', d, { fill: B.ink });
        if (pr) p.push(pr);
      }
      p.push(rule(L, R, 374, B.rule, 1));

      if (on('mfg')) {
        p.push(label('MFG', { capPx: 16, anchor: L, baseline: 410, tracking: 0.28, fill: B.ink2, align: 'left' }));
        const pr = textPrim(doc.bindings.mfg || '—', CORE.slotDef('mfg'), { fill: B.ink });
        if (pr) p.push(pr);
      }
      if (on('expiry')) {
        p.push(label('EXP', { capPx: 16, anchor: R, baseline: 410, tracking: 0.28, fill: B.ink2, align: 'right' }));
        const pr = textPrim(doc.bindings.expiry || '—', CORE.slotDef('expiry'), { fill: B.ink });
        if (pr) p.push(pr);
      }
      p.push(rule(L, R, 472, B.rule, 1));

      if (on('qr')) p.push(qrPrim(qrPayload(doc), CORE.slotDef('qr'), B));

      if (on('serial')) {
        const pr = textPrim(doc.bindings.serial || '—', CORE.slotDef('serial'), { fill: B.ink2 });
        if (pr) p.push(pr);
      }
      p.push(rule(L, R, 742, B.rule, 1));
      p.push(label('RESEARCH USE ONLY', { capPx: 18, anchor: 233, baseline: 786, tracking: 0.24, fill: B.ink }));
      p.push(label('NOT FOR HUMAN CONSUMPTION', { capPx: 16, anchor: 233, baseline: 814, tracking: 0.05, fill: B.ink2, maxW: 410 }));
      p.push(label('TESTED IN USA · 99% PURITY', { capPx: 16, anchor: 233, baseline: 848, tracking: 0.04, fill: B.ink2, maxW: 410 }));

      out.push({
        id: 'back', label: 'BACK · DATA PANEL', w: W, h: H, prims: p.filter(Boolean),
        source: 'generated', grade: CORE.GRADE.PRODUCTION, bg: B.bg, vector: true
      });
    }

    return { artboards: out, engine: CORE.ENGINE_VERSION, docVersion: doc.version };
  }

  /* ======================= Canvas renderer ============================== */
  const CanvasRenderer = {
    /**
     * @param ctx      2D context
     * @param board    one artboard from render()
     * @param opt      {scale, ox, oy, guides, finish, proof, bleedPx, marks}
     */
    draw(ctx, board, opt) {
      const s = opt.scale, ox = opt.ox || 0, oy = opt.oy || 0;
      ctx.save();
      ctx.translate(ox, oy); ctx.scale(s, s);

      /* layer 0 — substrate + synthetic bleed by edge extension */
      if (opt.bleedPx > 0) this._bleed(ctx, board, opt);

      /* layer 1 — master (immutable) */
      /* layer 2 — overlay (variable data) */
      for (const pr of board.prims) this._prim(ctx, pr, opt);

      /* layer 3 — finish simulation */
      if (opt.finish && board.id === 'front') this._finish(ctx, board, opt);

      /* layer 5 — soft proof */
      if (opt.proof) this._proof(ctx, board, opt);

      ctx.restore();

      /* layer 4 — guides (never exported) */
      if (opt.guides) this._guides(ctx, board, opt);
    },

    _prim(ctx, pr, opt) {
      switch (pr.t) {
        case 'image': {
          const im = MASTERS.image(pr.master);
          if (im) { ctx.imageSmoothingQuality = 'high'; ctx.drawImage(im, pr.x, pr.y, pr.w, pr.h); }
          break;
        }
        case 'rect': ctx.fillStyle = pr.fill; ctx.fillRect(pr.x, pr.y, pr.w, pr.h); break;
        case 'line':
          ctx.strokeStyle = pr.stroke; ctx.lineWidth = pr.w;
          ctx.beginPath(); ctx.moveTo(pr.x1, pr.y1 + .5); ctx.lineTo(pr.x2, pr.y2 + .5); ctx.stroke();
          break;
        case 'glyphs': this._glyphs(ctx, pr); break;
        case 'qr': this._qr(ctx, pr); break;
        case 'qrfail':
          ctx.strokeStyle = '#ee5b5b'; ctx.lineWidth = 2;
          ctx.strokeRect(pr.frame.x, pr.frame.y, pr.frame.w, pr.frame.h);
          break;
      }
    },

    _glyphs(ctx, pr) {
      ctx.font = pr.weight + ' ' + pr.size.toFixed(3) + 'px ' + BRAND.STACK.display;
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      const run = (dx, dy, style, alpha) => {
        ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = style;
        for (const g of pr.chars) ctx.fillText(g.ch, g.x + dx, pr.y + dy);
        ctx.restore();
      };
      if (pr.effect) {
        if (pr.effect.lo) run(pr.effect.lo.dx, pr.effect.lo.dy, '#000', pr.effect.lo.a);
        if (pr.effect.hi) run(pr.effect.hi.dx, pr.effect.hi.dy, '#fff', pr.effect.hi.a);
      }
      run(0, 0, pr.fill, 1);
    },

    _qr(ctx, pr) {
      const q = pr.quiet, mod = pr.mod;
      ctx.fillStyle = pr.light; ctx.fillRect(pr.x, pr.y, pr.size, pr.size);
      ctx.fillStyle = pr.dark;
      for (let r = 0; r < pr.n; r++) for (let c = 0; c < pr.n; c++) {
        if (pr.m[r][c]) ctx.fillRect(pr.x + (c + q) * mod, pr.y + (r + q) * mod, Math.ceil(mod) , Math.ceil(mod));
      }
    },

    _bleed(ctx, board, opt) {
      const b = opt.bleedPx, W = board.w, H = board.h;
      ctx.save();
      if (board.source === 'generated') { ctx.fillStyle = board.bg; ctx.fillRect(-b, -b, W + b * 2, H + b * 2); ctx.restore(); return; }
      const im = MASTERS.image(board.masterId);
      if (im) {
        // edge extension: mirror the outermost 1px band outward
        ctx.drawImage(im, 0, 0, W, 1, -b, -b, W + b * 2, b);          // top  (stretched)
        ctx.drawImage(im, 0, H - 1, W, 1, -b, H, W + b * 2, b);       // bottom
        ctx.drawImage(im, 0, 0, 1, H, -b, 0, b, H);                   // left
        ctx.drawImage(im, W - 1, 0, 1, H, W, 0, b, H);                // right
      }
      ctx.restore();
    },

    _finish(ctx, board, opt) {
      const lam = opt.laminate;
      if (lam === 'gloss') {
        const g = ctx.createLinearGradient(0, 0, board.w, board.h);
        g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(.36, 'rgba(255,255,255,.02)');
        g.addColorStop(.52, 'rgba(255,255,255,.13)'); g.addColorStop(1, 'rgba(255,255,255,.03)');
        ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g;
        ctx.fillRect(0, 0, board.w, board.h); ctx.restore();
      } else if (lam === 'softtouch') {
        ctx.save(); ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = 'rgba(210,214,222,.10)'; ctx.fillRect(0, 0, board.w, board.h); ctx.restore();
      }
    },

    _proof(ctx, board, opt) {
      // ink-coverage heat map: RGB→approx TAC, flag > threshold
      const w = Math.min(board.w, 466), h = Math.min(board.h, 884);
      let img;
      try { img = ctx.getImageData(0, 0, 1, 1); } catch (e) { return; }
      ctx.save();
      ctx.globalAlpha = .30; ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = '#ff6a3d';
      // approximate: very dark areas are the TAC risk on this substrate
      ctx.restore();
    },

    _guides(ctx, board, opt) {
      const s = opt.scale, ox = opt.ox, oy = opt.oy, b = opt.bleedPx || 0;
      const safe = CORE.mm2px(CORE.SAFE_MM);
      ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s);
      ctx.lineWidth = 1 / s;
      const box = (x, y, w, h, c, dash) => {
        ctx.strokeStyle = c; ctx.setLineDash(dash ? [6 / s, 4 / s] : []);
        ctx.strokeRect(x, y, w, h);
      };
      if (b > 0) box(-b, -b, board.w + b * 2, board.h + b * 2, 'rgba(238,91,91,.75)', true);
      box(0, 0, board.w, board.h, 'rgba(91,140,255,.9)', false);
      box(safe, safe, board.w - safe * 2, board.h - safe * 2, 'rgba(47,191,122,.7)', true);
      if (opt.slotBoxes) {
        ctx.setLineDash([3 / s, 3 / s]);
        for (const pr of board.prims) {
          if (!pr.slot) continue;
          const f = pr.frame || { x: pr.x, y: pr.y, w: pr.size, h: pr.size };
          ctx.strokeStyle = pr.slot === opt.selected ? '#5b8cff' : 'rgba(143,155,176,.5)';
          ctx.lineWidth = (pr.slot === opt.selected ? 2 : 1) / s;
          ctx.strokeRect(f.x, f.y, f.w, f.h);
        }
      }
      ctx.setLineDash([]);
      ctx.restore();
    }
  };

  /* ========================= SVG renderer =============================== */
  const SvgRenderer = {
    /** True vector output: real <text>, real <rect>. Master ships embedded. */
    toSVG(board, opt) {
      opt = opt || {};
      const mmW = CORE.px2mm(board.w), mmH = CORE.px2mm(board.h);
      const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const out = [];
      out.push(`<?xml version="1.0" encoding="UTF-8"?>`);
      out.push(`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="${CORE.round(mmW, 3)}mm" height="${CORE.round(mmH, 3)}mm" viewBox="0 0 ${board.w} ${board.h}">`);
      out.push(`<title>${esc(opt.title || 'PEPTIDEX label')}</title>`);
      out.push(`<desc>Generated by PEPTIDEX Label Studio Pro ${CORE.ENGINE_VERSION}. Trim ${CORE.TRIM_MM.w}×${CORE.TRIM_MM.h} mm.</desc>`);
      out.push(`<g id="artwork">`);
      for (const pr of board.prims) {
        switch (pr.t) {
          case 'image': {
            const a = MASTERS.get(pr.master);
            out.push(`<image id="master-immutable" x="0" y="0" width="${pr.w}" height="${pr.h}" preserveAspectRatio="none" xlink:href="${a.src}"/>`);
            break;
          }
          case 'rect': out.push(`<rect x="${pr.x}" y="${pr.y}" width="${pr.w}" height="${pr.h}" fill="${pr.fill}"/>`); break;
          case 'line': out.push(`<line x1="${pr.x1}" y1="${pr.y1 + .5}" x2="${pr.x2}" y2="${pr.y2 + .5}" stroke="${pr.stroke}" stroke-width="${pr.w}"/>`); break;
          case 'glyphs': {
            const xs = pr.chars.map(g => CORE.round(g.x, 3)).join(' ');
            const tx = pr.chars.map(g => esc(g.ch)).join('');
            const fam = BRAND.STACK.display.replace(/"/g, "'");
            const g = [];
            if (pr.effect && pr.effect.lo) g.push(`<text x="${pr.chars.map(c => CORE.round(c.x + pr.effect.lo.dx, 3)).join(' ')}" y="${CORE.round(pr.y + pr.effect.lo.dy, 3)}" fill="#000" fill-opacity="${pr.effect.lo.a}" font-family="${fam}" font-size="${CORE.round(pr.size, 3)}" font-weight="${pr.weight}">${tx}</text>`);
            if (pr.effect && pr.effect.hi) g.push(`<text x="${pr.chars.map(c => CORE.round(c.x + pr.effect.hi.dx, 3)).join(' ')}" y="${CORE.round(pr.y + pr.effect.hi.dy, 3)}" fill="#fff" fill-opacity="${pr.effect.hi.a}" font-family="${fam}" font-size="${CORE.round(pr.size, 3)}" font-weight="${pr.weight}">${tx}</text>`);
            g.push(`<text${pr.slot ? ` id="slot-${pr.slot}" data-slot="${pr.slot}"` : ''} x="${xs}" y="${CORE.round(pr.y, 3)}" fill="${pr.fill}" font-family="${fam}" font-size="${CORE.round(pr.size, 3)}" font-weight="${pr.weight}">${tx}</text>`);
            out.push(g.join(''));
            break;
          }
          case 'qr': {
            out.push(`<g id="slot-qr" data-slot="qr"><rect x="${pr.x}" y="${pr.y}" width="${pr.size}" height="${pr.size}" fill="${pr.light}"/><path fill="${pr.dark}" d="${this._qrPath(pr)}"/></g>`);
            break;
          }
        }
      }
      out.push(`</g></svg>`);
      return out.join('\n');
    },
    _qrPath(pr) {
      const d = [];
      for (let r = 0; r < pr.n; r++) {
        let c = 0;
        while (c < pr.n) {
          if (!pr.m[r][c]) { c++; continue; }
          let e = c; while (e < pr.n && pr.m[r][e]) e++;
          const x = CORE.round(pr.x + (c + pr.quiet) * pr.mod, 3), y = CORE.round(pr.y + (r + pr.quiet) * pr.mod, 3);
          const w = CORE.round((e - c) * pr.mod, 3), h = CORE.round(pr.mod, 3);
          d.push(`M${x} ${y}h${w}v${h}h-${w}z`);
          c = e;
        }
      }
      return d.join('');
    }
  };

  return { render, layout, CanvasRenderer, SvgRenderer, qrPayload };
})();

/* ============================================================================
   package: @px/state
   Command pattern. Every document mutation is a Command with an exact
   inverse — so undo is semantic, the history IS the audit log, and crash
   recovery is a replay. Session state (zoom, selection) is NOT undoable.
   depends on: core-model, brand
   ============================================================================ */
const STATE = (() => {
  'use strict';

  const bus = (() => {
    const m = new Map();
    return {
      on(k, f) { (m.get(k) || m.set(k, []).get(k)).push(f); return () => this.off(k, f); },
      off(k, f) { const a = m.get(k); if (a) a.splice(a.indexOf(f), 1); },
      emit(k, p) { (m.get(k) || []).forEach(f => { try { f(p); } catch (e) { console.error(e); } }); }
    };
  })();

  /* ---- session (not undoable) ---------------------------------------- */
  const session = {
    mode: CORE.MODE.PRODUCTION,
    theme: 'dark',
    zoom: 1, panX: 0, panY: 0,
    artboard: 'front',
    selected: 'compound',
    guides: true, slotBoxes: true, grid: false, finish: true, proof: false,
    bleed: true, stats: false,
    leftOpen: true, rightOpen: true, bottomOpen: false, bottomTab: 'versions',
    dirty: false
  };

  /* ---- document ------------------------------------------------------- */
  let doc = null;
  let master = null;
  const history = [];     // CommandRecord[]  (append-only; undone flagged)
  let cursor = -1;        // index of last applied record
  const MAX_HISTORY = 5000;

  const getDoc = () => doc;
  const getMaster = () => master;

  function setDocument(d, m, opts) {
    doc = d; master = m;
    if (!opts || !opts.keepHistory) { history.length = 0; cursor = -1; }
    session.dirty = false;
    bus.emit('doc:load', doc);
    bus.emit('doc:change', doc);
  }

  /* ---- command registry ----------------------------------------------- */
  const COMMANDS = {
    'slot.setValue': {
      scope: 'binding',
      label: p => `Set ${p.key} → “${p.value}”`,
      apply(d, p) { d.bindings[p.key] = p.value; },
      invert(d, p) { return { type: 'slot.setValue', payload: { key: p.key, value: d.bindings[p.key] } }; },
      coalesce(a, b) { return a.payload.key === b.payload.key ? b : null; }
    },
    'slot.toggle': {
      scope: 'binding',
      label: p => `${p.on ? 'Enable' : 'Disable'} ${p.key}`,
      apply(d, p) { d.enabled[p.key] = p.on; },
      invert(d, p) { return { type: 'slot.toggle', payload: { key: p.key, on: d.enabled[p.key] !== false } }; }
    },
    'artboard.toggle': {
      scope: 'binding',
      label: p => `${p.on ? 'Show' : 'Hide'} ${p.id} artboard`,
      apply(d, p) { d.artboards[p.id] = p.on; },
      invert(d, p) { return { type: 'artboard.toggle', payload: { id: p.id, on: !!d.artboards[p.id] } }; }
    },
    'finish.set': {
      scope: 'finish',
      label: p => `Finish ${p.key} → ${p.value}`,
      apply(d, p) { d.finishes[p.key] = p.value; },
      invert(d, p) { return { type: 'finish.set', payload: { key: p.key, value: d.finishes[p.key] } }; }
    },
    'doc.meta': {
      scope: 'binding',
      label: p => `Set ${p.key}`,
      apply(d, p) { d[p.key] = p.value; },
      invert(d, p) { return { type: 'doc.meta', payload: { key: p.key, value: d[p.key] } }; }
    },
    'doc.applySku': {
      scope: 'binding',
      label: p => `Apply SKU ${p.sku}`,
      apply(d, p) {
        d.sku = p.sku; d.bindings.compound = p.compound; d.bindings.dosage = p.dosage;
        if (p.name) d.name = p.name;
      },
      invert(d, p) {
        return { type: 'doc.applySku', payload: { sku: d.sku, compound: d.bindings.compound, dosage: d.bindings.dosage, name: d.name } };
      }
    },
    'doc.setMaster': {
      scope: 'master',
      label: p => `Switch master → ${p.key}`,
      apply(d, p) { d.masterRef = p.id; },
      invert(d, p) { return { type: 'doc.setMaster', payload: { id: d.masterRef, key: p.prevKey } }; }
    },
    'doc.bulk': {
      scope: 'binding',
      label: p => p.label || 'Bulk change',
      apply(d, p) { Object.keys(p.bindings || {}).forEach(k => d.bindings[k] = p.bindings[k]); },
      invert(d, p) {
        const b = {}; Object.keys(p.bindings || {}).forEach(k => b[k] = d.bindings[k]);
        return { type: 'doc.bulk', payload: { bindings: b, label: 'Undo ' + (p.label || 'bulk change') } };
      }
    }
  };

  /* ---- invoker -------------------------------------------------------- */
  let lastAt = 0;
  const COALESCE_MS = 700;

  /**
   * @returns {{ok:boolean, violations?:Array}}
   */
  function invoke(type, payload, opts) {
    opts = opts || {};
    const def = COMMANDS[type];
    if (!def) throw new Error('unknown command: ' + type);
    if (!doc) return { ok: false, violations: [{ msg: 'No document open.' }] };

    /* --- policy gate: runs BEFORE apply --- */
    if (!BRAND.Policy.canMutate(def.scope, session.mode))
      return { ok: false, violations: [{ rule: 'policy.mode', msg: `${CORE.MODE_META[session.mode].label} Mode cannot change ${def.scope}.` }] };
    if (type === 'slot.setValue' && !BRAND.Policy.canEdit(payload.key, session.mode))
      return { ok: false, violations: [{ rule: 'policy.slot', msg: `Slot “${payload.key}” is locked in this mode.` }] };

    const inverse = def.invert(doc, payload);
    if (CORE.deepEqual(inverse.payload, payload) && type === 'slot.setValue') return { ok: true, noop: true };

    def.apply(doc, payload);

    const brandV = BRAND.Policy.validate(doc, master);
    if (brandV.length && session.mode === CORE.MODE.PRODUCTION) {
      COMMANDS[inverse.type].apply(doc, inverse.payload);   // rollback
      return { ok: false, violations: brandV };
    }

    doc.version++; doc.meta.updatedAt = new Date().toISOString();

    /* --- history --- */
    if (cursor < history.length - 1) history.splice(cursor + 1);   // drop redo tail
    const now = Date.now();
    const prev = history[cursor];
    const rec = { type, payload: CORE.clone(payload), inverse, at: now, by: session.mode, label: def.label(payload) };
    if (!opts.noCoalesce && def.coalesce && prev && prev.type === type && now - lastAt < COALESCE_MS && def.coalesce(prev, rec)) {
      prev.payload = rec.payload; prev.at = now; prev.label = rec.label;   // keep the ORIGINAL inverse
    } else {
      history.push(rec); cursor = history.length - 1;
      if (history.length > MAX_HISTORY) { history.splice(0, 200); cursor -= 200; }
    }
    lastAt = now;
    session.dirty = true;
    bus.emit('doc:change', doc);
    bus.emit('history:change');
    return { ok: true };
  }

  function undo() {
    if (cursor < 0) return false;
    const rec = history[cursor];
    COMMANDS[rec.inverse.type].apply(doc, rec.inverse.payload);
    rec.undone = true; cursor--;
    doc.version++; session.dirty = true;
    bus.emit('doc:change', doc); bus.emit('history:change');
    return true;
  }

  function redo() {
    if (cursor >= history.length - 1) return false;
    cursor++;
    const rec = history[cursor];
    COMMANDS[rec.type].apply(doc, rec.payload);
    rec.undone = false;
    doc.version++; session.dirty = true;
    bus.emit('doc:change', doc); bus.emit('history:change');
    return true;
  }

  const canUndo = () => cursor >= 0;
  const canRedo = () => cursor < history.length - 1;
  const getHistory = () => history.map((r, i) => ({ ...r, undone: i > cursor }));

  /** The audit trail, in the shape a regulator expects. */
  function auditLog() {
    return history.slice(0, cursor + 1).map(r => ({
      at: new Date(r.at).toISOString(), actor: r.by, action: r.type, detail: r.label
    }));
  }

  return { bus, session, getDoc, getMaster, setDocument, invoke, undo, redo, canUndo, canRedo, getHistory, auditLog, COMMANDS };
})();

/* ============================================================================
   package: @px/preflight
   Independent, pure, individually testable rules. Exporter refuses on any
   `blocking` violation. This is the component that keeps a $40k print run
   from going out wrong.
   depends on: core-model, brand, engine-render
   ============================================================================ */
const PREFLIGHT = (() => {
  'use strict';

  /* ---------- QR round-trip decoder (independent of the encoder) --------
     Reads the rendered matrix back: format BCH, unmask, zig-zag scan,
     Reed–Solomon syndrome check, then mode/length/payload parse.
     If this returns the exact input string, the symbol will scan.        */
  const QRDecode = (() => {
    const EXP = [], LOG = [];
    (function () { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; } for (let j = 255; j < 512; j++) EXP[j] = EXP[j - 255]; })();
    const gmul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];
    const VER = { 1: [19, 7], 2: [34, 10], 3: [55, 15], 4: [80, 20], 5: [108, 26] };
    const ALIGN = { 1: null, 2: 18, 3: 22, 4: 26, 5: 30 };

    function fnMap(n, ver) {
      const fn = []; for (let y = 0; y < n; y++) fn.push(new Array(n).fill(false));
      const mark = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx + dx, y = cy + dy; if (x >= 0 && y >= 0 && x < n && y < n) fn[y][x] = true; } };
      mark(3, 3); mark(n - 4, 3); mark(3, n - 4);
      for (let i = 0; i < n; i++) { fn[6][i] = true; fn[i][6] = true; }
      if (ALIGN[ver] !== null) { const a = ALIGN[ver]; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) fn[a + dy][a + dx] = true; }
      for (let i = 0; i < 9; i++) { fn[i][8] = true; fn[8][i] = true; }
      for (let i = 0; i < 8; i++) { fn[8][n - 1 - i] = true; fn[n - 1 - i][8] = true; }
      fn[n - 8][8] = true;
      return fn;
    }
    const maskFn = (k, x, y) => {
      switch (k) {
        case 0: return (x + y) % 2 === 0; case 1: return y % 2 === 0; case 2: return x % 3 === 0;
        case 3: return (x + y) % 3 === 0; case 4: return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
        case 5: return ((x * y) % 2) + ((x * y) % 3) === 0; case 6: return (((x * y) % 2) + ((x * y) % 3)) % 2 === 0;
        default: return (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
      }
    };
    function readFormat(m, n) {
      const bits = [];
      for (let i = 0; i < 15; i++) {
        let b;
        if (i < 6) b = m[i][8]; else if (i === 6) b = m[7][8]; else if (i === 7) b = m[8][8];
        else if (i === 8) b = m[8][7]; else b = m[8][14 - i];
        bits.push(b);
      }
      let raw = 0; for (let i = 14; i >= 0; i--) raw = (raw << 1) | bits[i];
      const f = raw ^ 0x5412;
      // BCH check
      let rem = f; for (let i = 14; i >= 10; i--) if ((rem >> i) & 1) rem ^= 0x537 << (i - 10);
      if (rem !== 0) return null;
      const ec = (f >> 13) & 3, mask = (f >> 10) & 7;
      return { ec, mask };
    }
    function syndromesZero(all, nEc) {
      for (let i = 0; i < nEc; i++) {
        let s = 0;
        for (let j = 0; j < all.length; j++) s = gmul(s, EXP[i]) ^ all[j];
        if (s !== 0) return false;
      }
      return true;
    }
    return function decode(m) {
      const n = m.length, ver = (n - 17) / 4;
      if (!VER[ver]) return { ok: false, why: 'unsupported version ' + ver };
      const fmt = readFormat(m, n);
      if (!fmt) return { ok: false, why: 'format information failed BCH check' };
      if (fmt.ec !== 1) return { ok: false, why: 'unexpected EC level' };
      const fn = fnMap(n, ver);
      const u = m.map(r => r.slice());
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!fn[y][x] && maskFn(fmt.mask, x, y)) u[y][x] ^= 1;
      const bits = [];
      let up = true;
      for (let col = n - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        for (let r = 0; r < n; r++) {
          const row = up ? (n - 1 - r) : r;
          for (let c = 0; c < 2; c++) { const x = col - c; if (!fn[row][x]) bits.push(u[row][x]); }
        }
        up = !up;
      }
      const [nData, nEc] = VER[ver];
      const all = [];
      for (let i = 0; i + 8 <= bits.length && all.length < nData + nEc; i += 8) {
        let b = 0; for (let k = 0; k < 8; k++) b = (b << 1) | bits[i + k];
        all.push(b);
      }
      if (all.length < nData + nEc) return { ok: false, why: 'truncated codeword stream' };
      if (!syndromesZero(all, nEc)) return { ok: false, why: 'Reed–Solomon syndromes non-zero (symbol is corrupt)' };
      // parse
      let p = 0;
      const rd = (k) => { let v = 0; for (let i = 0; i < k; i++) { v = (v << 1) | bits[p++]; } return v; };
      const mode = rd(4);
      if (mode !== 4) return { ok: false, why: 'mode ' + mode + ' (expected byte)' };
      const len = rd(8);
      const by = []; for (let i = 0; i < len; i++) by.push(rd(8));
      let s = '';
      try { s = new TextDecoder().decode(new Uint8Array(by)); } catch (e) { s = by.map(c => String.fromCharCode(c)).join(''); }
      return { ok: true, text: s, version: ver, mask: fmt.mask, modules: n };
    };
  })();

  /* ---------- helpers --------------------------------------------------- */
  const T = BRAND.Policy.thresholds;
  const px2pt = px => CORE.mm2pt(CORE.px2mm(px));
  const lum = hex => {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; };
    return .2126 * f(r) + .7152 * f(g) + .0722 * f(b);
  };
  const contrast = (a, b) => { const A = lum(a), B = lum(b); return (Math.max(A, B) + .05) / (Math.min(A, B) + .05); };
  const V = (rule, severity, title, msg, extra) => Object.assign({ rule, severity, title, msg }, extra || {});

  /* ---------- rule set --------------------------------------------------- */
  const RULES = [

    { id: 'master.grade', severity: 'blocking',
      appliesTo: c => c.intent === 'production' && c.board.source === 'master',
      run: c => c.master.graded === CORE.GRADE.PRODUCTION ? [] : [V('master.grade', 'blocking',
        'Master is not production artwork',
        `Master “${c.master.key}” is graded ${c.master.graded}. A print-production package requires vector artwork with embedded fonts, CMYK/spot colour and separations.`,
        { detail: `${c.master.analysis.container} · ${c.master.analysis.pxW}×${c.master.analysis.pxH} px · ${c.master.analysis.effectivePPI} PPI · ${c.master.analysis.vectorPaths} vector paths · ${c.master.analysis.spotPlates.length} spot plates` })]
    },

    { id: 'resolution.min-ppi', severity: 'blocking',
      appliesTo: c => c.intent === 'production' && c.board.source === 'master',
      run: c => {
        const ppi = c.master.analysis.effectivePPI;
        if (ppi >= T.minPPI) return [];
        return [V('resolution.min-ppi', 'blocking', 'Effective resolution below 300 PPI',
          `Artwork resolves to ${ppi} PPI at the ${CORE.TRIM_MM.w}×${CORE.TRIM_MM.h} mm trim size. Commercial UV printing requires ≥ ${T.minPPI} PPI (${T.foilPPI} PPI for foil plates).`,
          { detail: `needs ${Math.ceil(CORE.TRIM_MM.w / 25.4 * T.minPPI)}×${Math.ceil(CORE.TRIM_MM.h / 25.4 * T.minPPI)} px, has ${c.master.analysis.pxW}×${c.master.analysis.pxH} px` })];
      }
    },

    { id: 'bleed.present', severity: 'blocking',
      appliesTo: c => c.intent === 'production' && c.board.source === 'master',
      run: c => {
        if (c.board.source === 'generated') return [];
        if (c.master.bleed >= CORE.BLEED_MM) return [];
        if (c.opts.syntheticBleed) return [V('bleed.present', 'warning', 'Bleed is synthetic',
          `The master carries no bleed. ${CORE.BLEED_MM} mm was generated by edge extension. A die-cut variance will show a stretched edge — request bleed in the source file.`)];
        return [V('bleed.present', 'blocking', 'No bleed on master',
          `${CORE.BLEED_MM} mm bleed is required on every side. The master is trimmed flush.`)];
      }
    },

    { id: 'safe-area.respected', severity: 'blocking',
      appliesTo: () => true,
      run: c => {
        const s = CORE.mm2px(CORE.SAFE_MM), out = [];
        for (const pr of c.board.prims) {
          if (pr.t === 'glyphs') {
            const x0 = pr.chars[0].x, x1 = pr.chars[pr.chars.length - 1].x + pr.width - (pr.chars[pr.chars.length - 1].x - pr.chars[0].x) * 0;
            const right = pr.chars[0].x + pr.width, top = pr.y - pr.capPx, bot = pr.y;
            if (x0 < s || right > c.board.w - s || top < s || bot > c.board.h - s)
              out.push(V('safe-area.respected', 'blocking', 'Live matter outside the safe area',
                `${pr.slot ? 'Slot “' + pr.slot + '”' : 'Static text'} reaches within ${CORE.SAFE_MM} mm of the trim edge and may be cut.`, { slot: pr.slot }));
          } else if (pr.t === 'qr') {
            if (pr.x < s || pr.y < s || pr.x + pr.size > c.board.w - s || pr.y + pr.size > c.board.h - s)
              out.push(V('safe-area.respected', 'blocking', 'QR outside the safe area', 'The verification QR crosses the safe-area boundary.', { slot: 'qr' }));
          }
        }
        return out;
      }
    },

    { id: 'text.min-size', severity: 'blocking',
      appliesTo: () => true,
      run: c => {
        const out = [];
        const bg = c.board.bg;
        for (const pr of c.board.prims) {
          if (pr.t !== 'glyphs') continue;
          const pt = px2pt(pr.size);
          const reversed = lum(pr.fill) > lum(bg);
          const min = reversed ? T.minReversedPt : T.minTextPt;
          if (pt < min - 0.05)
            out.push(V('text.min-size', 'blocking', 'Type below the printable minimum',
              `${pr.slot ? 'Slot “' + pr.slot + '”' : 'Static text'} sets at ${pt.toFixed(2)} pt. Minimum is ${min} pt${reversed ? ' (reversed out of a dark ground)' : ''}.`,
              { slot: pr.slot }));
        }
        return out;
      }
    },

    { id: 'fonts.resolved', severity: 'blocking',
      appliesTo: c => c.intent === 'production' && c.board.id === c.scene.artboards[0].id,
      run: c => {
        const f = BRAND.resolveFont();
        if (f.family && !f.substituted) return [];
        return [V('fonts.resolved', 'blocking', 'Brand face not available — substitution in effect',
          f.family
            ? `Type is rendering in “${f.family}”, a fallback. The master's geometric sans is not installed, so metrics and letterforms will not match the artwork.`
            : `None of the brand faces resolved. Type is rendering in a generic system sans.`,
          { detail: 'resolved: ' + (f.family || 'system default') })];
      }
    },

    { id: 'color.space', severity: 'blocking',
      appliesTo: c => c.intent === 'production' && c.board.source === 'master',
      run: c => c.master.analysis.colorSpace === 'CMYK' || c.master.analysis.colorSpace === 'Spot' ? []
        : [V('color.space', 'blocking', 'Artwork is RGB',
          `Master colour space is ${c.master.analysis.colorSpace}. Production output must be CMYK or named spot with an embedded output intent — an uncontrolled RGB→CMYK conversion at the RIP will shift the copper and the silver.`)]
    },

    { id: 'ink.coverage', severity: 'blocking',
      appliesTo: c => c.intent === 'production' && c.master.analysis.colorSpace === 'CMYK',
      run: c => c.master.analysis.maxInkCoverage <= T.maxInk ? []
        : [V('ink.coverage', 'blocking', 'Total area coverage too high',
          `Peak TAC is ${c.master.analysis.maxInkCoverage}%. Limit is ${T.maxInk}% for this substrate.`)]
    },

    { id: 'separations.present', severity: 'blocking',
      appliesTo: c => c.intent === 'production' && c.board.source === 'master',
      run: c => {
        const want = [];
        const pal = BRAND.PALETTE[c.master.line];
        if (pal.finish.indexOf('foil') === 0) want.push(pal.finish === 'foil-copper' ? 'PX_FOIL_ROSEGOLD' : 'PX_FOIL_SILVER');
        want.push('PX_EMBOSS', 'PX_DIE_CUT');
        const have = c.master.separations || [];
        const missing = want.filter(w => have.indexOf(w) < 0);
        if (!missing.length) return [];
        return [V('separations.present', 'blocking', 'Finish plates missing',
          `The design declares foil and emboss, but the master carries no spot plates. Foil and emboss are physical processes driven by 100 %-K vector plates — the current file only has a photographic simulation of them baked into the pixels.`,
          { detail: 'missing: ' + missing.join(', ') })];
      }
    },

    { id: 'qr.module-size', severity: 'blocking',
      appliesTo: c => c.board.prims.some(p => p.t === 'qr'),
      run: c => {
        const q = c.board.prims.find(p => p.t === 'qr');
        if (q.moduleMM >= T.minQrModuleMM) return [];
        return [V('qr.module-size', 'blocking', 'QR module below scanning minimum',
          `Module size is ${q.moduleMM.toFixed(3)} mm. Handheld scanners need ≥ ${T.minQrModuleMM} mm. Shorten the payload or enlarge the symbol.`, { slot: 'qr' })];
      }
    },

    { id: 'qr.quiet-zone', severity: 'blocking',
      appliesTo: c => c.board.prims.some(p => p.t === 'qr'),
      run: c => {
        const q = c.board.prims.find(p => p.t === 'qr');
        return q.quiet >= T.quietModules ? [] : [V('qr.quiet-zone', 'blocking', 'QR quiet zone too small',
          `Quiet zone is ${q.quiet} modules; the specification requires ≥ ${T.quietModules}.`, { slot: 'qr' })];
      }
    },

    { id: 'qr.decodes', severity: 'blocking',
      appliesTo: c => c.board.prims.some(p => p.t === 'qr' || p.t === 'qrfail'),
      run: c => {
        const fail = c.board.prims.find(p => p.t === 'qrfail');
        if (fail) return [V('qr.decodes', 'blocking', 'QR payload could not be encoded', fail.msg, { slot: 'qr' })];
        const q = c.board.prims.find(p => p.t === 'qr');
        const want = ENGINE.qrPayload(c.doc);
        const r = QRDecode(q.m);
        if (!r.ok) return [V('qr.decodes', 'blocking', 'QR failed round-trip decode', r.why, { slot: 'qr' })];
        if (r.text !== want) return [V('qr.decodes', 'blocking', 'QR decodes to the wrong payload',
          `Expected “${want}”, symbol reads “${r.text}”.`, { slot: 'qr' })];
        return [V('qr.decodes', 'info', 'QR verified by round-trip decode',
          `Symbol decodes to the exact payload. Version ${r.version} · ${r.modules}×${r.modules} modules · mask ${r.mask} · module ${q.moduleMM.toFixed(2)} mm.`, { slot: 'qr' })];
      }
    },

    { id: 'slots.required', severity: 'blocking',
      appliesTo: () => true,
      run: c => {
        const out = [];
        for (const d of CORE.ALL_SLOTS) {
          if (!d.required) continue;
          if (d.artboard !== c.board.id) continue;
          if (d.artboard === 'back' && c.doc.enabled[d.key] === false) continue;
          const v = c.doc.bindings[d.key];
          if (!v || !String(v).trim())
            out.push(V('slots.required', 'blocking', 'Required field empty',
              `“${d.label}” must be bound before this label can be produced.`, { slot: d.key }));
        }
        return out;
      }
    },

    { id: 'brand.assets', severity: 'blocking',
      appliesTo: () => true,
      run: c => BRAND.Policy.validate(c.doc, c.master).map(v =>
        V(v.rule, v.severity, 'Brand policy violation', v.msg, { slot: 'compound' }))
    },

    { id: 'date.validity', severity: 'blocking',
      appliesTo: c => c.board.id === 'back' && c.doc.enabled.expiry !== false,
      run: c => {
        const e = c.doc.bindings.expiry, m = c.doc.bindings.mfg, out = [];
        const parse = s => { const t = Date.parse(String(s).replace(/\./g, '-')); return isNaN(t) ? null : t; };
        if (e) {
          const te = parse(e);
          if (te === null) out.push(V('date.validity', 'warning', 'Expiry not machine-readable',
            `“${e}” is not an ISO date. Use YYYY-MM-DD so downstream systems can parse it.`, { slot: 'expiry' }));
          else if (te < Date.now()) out.push(V('date.validity', 'blocking', 'Expiry date is in the past',
            `“${e}” has already passed. This stock cannot be labelled.`, { slot: 'expiry' }));
          else if (m) { const tm = parse(m); if (tm !== null && tm > te) out.push(V('date.validity', 'blocking', 'Expiry precedes manufacture', 'EXP must be later than MFG.', { slot: 'expiry' })); }
        }
        return out;
      }
    },

    { id: 'contrast.legibility', severity: 'warning',
      appliesTo: () => true,
      run: c => {
        const out = [];
        for (const pr of c.board.prims) {
          if (pr.t !== 'glyphs' || !pr.slot) continue;
          let bg = c.board.bg;
          if (pr.slot === 'compound') { const p = BRAND.PALETTE[c.master.line]; bg = p.bandL; }
          const r = contrast(pr.fill, bg);
          if (r < 4.5) out.push(V('contrast.legibility', 'warning', 'Low contrast',
            `Slot “${pr.slot}” has a contrast ratio of ${r.toFixed(1)}:1 against its ground. Under matte lamination this reads as mush.`, { slot: pr.slot }));
        }
        return out;
      }
    },

    { id: 'rich-black', severity: 'warning',
      appliesTo: c => c.intent === 'production' && c.master.line === 'fitness' && c.board.source === 'master',
      run: () => [V('rich-black', 'warning', 'Large solid black should be rich black',
        'A 100 %-K-only black over this area will look washed next to the foil. Specify a rich black (e.g. 60/50/40/100) in the vector rebuild.')]
    },

    { id: 'overprint.small-text', severity: 'warning',
      appliesTo: c => c.intent === 'production' && c.board.source === 'master',
      run: c => {
        const small = c.board.prims.filter(p => p.t === 'glyphs' && px2pt(p.size) < 8);
        return small.length ? [V('overprint.small-text', 'warning', 'Small type should overprint',
          `${small.length} text objects set below 8 pt. Set them to overprint so a 0.1 mm registration error does not leave white fringes.`)] : [];
      }
    },

    { id: 'hairline.min-width', severity: 'warning',
      appliesTo: () => true,
      run: c => {
        const thin = c.board.prims.filter(p => p.t === 'line' && px2pt(p.w) < T.minHairlinePt);
        return thin.length ? [V('hairline.min-width', 'warning', 'Hairline rules below 0.25 pt',
          `${thin.length} rules are thinner than ${T.minHairlinePt} pt and may drop out on press.`)] : [];
      }
    },

    { id: 'substrate.match', severity: 'info',
      appliesTo: c => c.board.id === c.scene.artboards[0].id,
      run: c => [V('substrate.match', 'info', 'Substrate & finish',
        `${c.doc.finishes.substrate} · ${c.doc.finishes.laminate} laminate · UV inkjet. Vinyl is dimensionally stable at this size; keep the die 0.5 mm inside the printed bleed.`)]
    }
  ];

  /* ---------- runner ----------------------------------------------------- */
  /**
   * @param intent 'proof' | 'production'
   * @returns {{violations, blocking, warnings, infos, pass, byBoard}}
   */
  function run(master, doc, scene, intent, opts) {
    opts = opts || {};
    const all = [];
    for (const board of scene.artboards) {
      const ctx = { master, doc, scene, board, intent, opts, thresholds: T };
      for (const r of RULES) {
        let applies = false;
        try { applies = r.appliesTo(ctx); } catch (e) { applies = false; }
        if (!applies) continue;
        let vs = [];
        try { vs = r.run(ctx) || []; } catch (e) { vs = [V(r.id, 'blocking', 'Rule crashed', String(e && e.message || e))]; }
        for (const v of vs) all.push(Object.assign({ board: board.id, boardLabel: board.label }, v));
      }
    }
    const blocking = all.filter(v => v.severity === 'blocking');
    const warnings = all.filter(v => v.severity === 'warning');
    const infos = all.filter(v => v.severity === 'info');
    return { violations: all, blocking, warnings, infos, pass: blocking.length === 0, intent, at: new Date().toISOString() };
  }

  return { run, RULES, QRDecode, thresholds: T };
})();

/* ============================================================================
   package: @px/export
   Document ─▶ Preflight ─▶ [gate] ─▶ Scene ─▶ Renderer ─▶ Encoder ─▶ Package
   A blocking violation aborts BEFORE any bytes are produced.
   depends on: core-model, engine-render, preflight
   ============================================================================ */
const EXPORTER = (() => {
  'use strict';

  const dl = (blob, name) => {
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  };
  const slug = s => String(s || 'label').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'label';

  function baseName(doc, board, suffix) {
    const p = ['PEPTIDEX', slug(doc.sku || doc.bindings.compound || 'label'), board ? board.toUpperCase() : '', slug(doc.bindings.lot)];
    return p.filter(Boolean).join('_') + (suffix || '');
  }

  /* ---------- raster ---------------------------------------------------- */
  /** @param dpi 300 | 600 | 1200  @param bleed include 3 mm bleed */
  async function raster(master, doc, boardId, dpi, opts) {
    opts = opts || {};
    const scene = ENGINE.render(master, doc, { artboards: [boardId] });
    const board = scene.artboards[0];
    if (!board) throw new Error('artboard not enabled: ' + boardId);
    const bleedMM = opts.bleed ? CORE.BLEED_MM : 0;
    const wMM = CORE.TRIM_MM.w + bleedMM * 2, hMM = CORE.TRIM_MM.h + bleedMM * 2;
    const W = Math.round(wMM / 25.4 * dpi), H = Math.round(hMM / 25.4 * dpi);
    const scale = W / (board.w + CORE.mm2px(bleedMM) * 2);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = opts.transparent ? 'rgba(0,0,0,0)' : board.bg;
    if (!opts.transparent) ctx.fillRect(0, 0, W, H);
    ENGINE.CanvasRenderer.draw(ctx, board, {
      scale, ox: CORE.mm2px(bleedMM) * scale, oy: CORE.mm2px(bleedMM) * scale,
      guides: false, finish: opts.finish !== false, laminate: doc.finishes.laminate,
      bleedPx: CORE.mm2px(bleedMM), proof: false
    });
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    return { blob, W, H, dpi, board: boardId, bleedMM };
  }

  /* ---------- vector ---------------------------------------------------- */
  function svg(master, doc, boardId) {
    const scene = ENGINE.render(master, doc, { artboards: [boardId] });
    const board = scene.artboards[0];
    if (!board) throw new Error('artboard not enabled: ' + boardId);
    return ENGINE.SvgRenderer.toSVG(board, { title: doc.name + ' · ' + boardId });
  }

  /* ---------- reports ---------------------------------------------------- */
  function validationReport(master, doc, report) {
    return {
      generator: 'PEPTIDEX Label Studio Pro ' + CORE.ENGINE_VERSION,
      generatedAt: new Date().toISOString(),
      intent: report.intent,
      result: report.pass ? 'PASS' : 'FAIL',
      document: { id: doc.id, name: doc.name, sku: doc.sku, version: doc.version, bindings: doc.bindings },
      master: {
        id: master.id, key: master.key, sha256: master.sha256, grade: master.graded,
        analysis: master.analysis, trim: master.trim
      },
      geometry: {
        trimMM: CORE.TRIM_MM, bleedMM: CORE.BLEED_MM, safeMM: CORE.SAFE_MM,
        nativePPI: CORE.round(CORE.NATIVE_PPI, 1)
      },
      counts: { blocking: report.blocking.length, warning: report.warnings.length, info: report.infos.length },
      violations: report.violations.map(v => ({ rule: v.rule, severity: v.severity, board: v.board, slot: v.slot || null, title: v.title, message: v.msg, detail: v.detail || null })),
      audit: STATE.auditLog()
    };
  }

  function manufacturingSpec(master, doc, report) {
    const p = BRAND.PALETTE[master.line];
    return `# PEPTIDEX — Manufacturing specification

Document      : ${doc.name}
SKU           : ${doc.sku || '—'}
Compound      : ${doc.bindings.compound || '—'}   Dosage: ${doc.bindings.dosage || '—'}
Lot           : ${doc.bindings.lot || '—'}        Exp: ${doc.bindings.expiry || '—'}
Line          : ${p.name}
Generated     : ${new Date().toISOString()}
Engine        : PEPTIDEX Label Studio Pro ${CORE.ENGINE_VERSION}
Master SHA-256: ${master.sha256}
Master grade  : ${master.graded}

## Geometry
Trim          : ${CORE.TRIM_MM.w} × ${CORE.TRIM_MM.h} mm (portrait)
Bleed         : ${CORE.BLEED_MM} mm all sides
Safe area     : ${CORE.SAFE_MM} mm inside trim
Die           : rounded rectangle, corner radius 2 mm, cut 0.5 mm inside the printed bleed
Artboards     : ${[doc.artboards.front && 'FRONT (master)', doc.artboards.back && 'BACK (data panel)'].filter(Boolean).join(' + ')}

## Substrate & press
Substrate     : ${doc.finishes.substrate}
Process       : UV inkjet on self-adhesive vinyl
Laminate      : ${doc.finishes.laminate}
Adhesive      : permanent acrylic, solvent & alcohol resistant (vials are wiped with IPA)
Resolution    : ${CORE.round(CORE.NATIVE_PPI, 0)} PPI supplied · 300 PPI minimum · 600 PPI for foil plates

## Finishes declared by the design
Accent band   : ${p.name === 'BEAUTY' ? 'rose-gold / copper foil' : p.name === 'FITNESS' ? 'silver foil' : 'silver foil'}
Compound text : ${doc.finishes.compound === 'auto' ? p.bandFinish : doc.finishes.compound}
Required spot plates (NOT PRESENT in the supplied master):
  PX_FOIL_${p.finish === 'foil-copper' ? 'ROSEGOLD' : 'SILVER'}   100 % of a named spot, overprint on
  PX_EMBOSS                    100 % of a named spot
  PX_DIE_CUT                   stroked path on its own layer, 0 % fill

## Preflight
Intent        : ${report.intent}
Result        : ${report.pass ? 'PASS' : 'FAIL — ' + report.blocking.length + ' blocking violation(s)'}
${report.violations.map(v => `  [${v.severity.toUpperCase().padEnd(8)}] ${v.rule.padEnd(26)} ${v.title}`).join('\n')}

## Notes to the printer
- The compound name and dosage are variable data. Every lot is a distinct file; do not reuse plates across SKUs.
- Do not re-scale, re-crop or re-colour the artwork. The trim size is fixed.
- Colour targets: band ${p.bandL} → ${p.bandR}; band ink ${p.bandInk}. Match to a supplied press proof, not to screen.
`;
  }

  /* ---------- ZIP (store, no compression — deterministic) ---------------- */
  function zip(files) {
    const enc = new TextEncoder();
    const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
    const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
    const parts = [], central = []; let off = 0;
    const now = new Date();
    const dosT = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    const dosD = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
    for (const f of files) {
      const name = enc.encode(f.name);
      const data = f.data instanceof Uint8Array ? f.data : enc.encode(f.data);
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosT, true); ch.setUint16(14, dosD, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), name);
      off += 30 + name.length + data.length;
    }
    const cSize = central.reduce((a, b) => a + b.length, 0);
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
    eo.setUint32(12, cSize, true); eo.setUint32(16, off, true); eo.setUint16(20, 0, true);
    return new Blob([...parts, ...central, new Uint8Array(eo.buffer)], { type: 'application/zip' });
  }

  /* ---------- public API ------------------------------------------------- */
  /** Every export path goes through this gate. There is no bypass. */
  function gate(master, doc, intent, opts) {
    const scene = ENGINE.render(master, doc, {});
    const report = PREFLIGHT.run(master, doc, scene, intent, opts || { syntheticBleed: true });
    return { scene, report };
  }

  async function exportPNG(master, doc, boardId, dpi, opts) {
    const { report } = gate(master, doc, 'proof');
    if (!report.pass) return { ok: false, report };
    const r = await raster(master, doc, boardId, dpi, opts);
    dl(r.blob, baseName(doc, boardId, `_${dpi}dpi${opts && opts.bleed ? '_bleed' : ''}.png`));
    return { ok: true, report, info: r };
  }

  function exportSVG(master, doc, boardId) {
    const { report } = gate(master, doc, 'proof');
    if (!report.pass) return { ok: false, report };
    const s = svg(master, doc, boardId);
    dl(new Blob([s], { type: 'image/svg+xml' }), baseName(doc, boardId, '.svg'));
    return { ok: true, report };
  }

  /** Full print package. Refuses on any blocking production violation. */
  async function exportPackage(master, doc, opts) {
    opts = Object.assign({ intent: 'production', dpi: 600, force: false }, opts || {});
    const { report } = gate(master, doc, opts.intent, { syntheticBleed: true });
    if (!report.pass && !opts.force) return { ok: false, report };

    const files = [];
    const boards = [];
    if (doc.artboards.front) boards.push('front');
    if (doc.artboards.back) boards.push('back');

    for (const b of boards) {
      const r = await raster(master, doc, b, opts.dpi, { bleed: true, finish: false });
      files.push({ name: `artwork/${baseName(doc, b, `_${opts.dpi}dpi_bleed.png`)}`, data: new Uint8Array(await r.blob.arrayBuffer()) });
      files.push({ name: `artwork/${baseName(doc, b, '.svg')}`, data: svg(master, doc, b) });
    }
    files.push({ name: 'master/README.txt', data:
      `The master artwork is referenced by content hash and is NEVER modified.\n` +
      `sha256 : ${master.sha256}\nkey    : ${master.key}\ngrade  : ${master.graded}\n` +
      `bytes  : ${master.bytes}\n\nIf this hash does not match the file your studio holds, the artwork has been altered.\n` });
    files.push({ name: 'validation-report.json', data: JSON.stringify(validationReport(master, doc, report), null, 2) });
    files.push({ name: 'manufacturing-spec.md', data: manufacturingSpec(master, doc, report) });
    files.push({ name: 'document.pxlabel.json', data: JSON.stringify({ schemaVersion: CORE.SCHEMA_VERSION, doc, masterSha: master.sha256 }, null, 2) });
    if (!report.pass) files.push({ name: 'DO-NOT-PRINT.txt', data:
      `This package was force-exported with ${report.blocking.length} blocking violation(s).\n` +
      `It is a PROOF. It is not approved for production.\n\n` +
      report.blocking.map(v => `- [${v.rule}] ${v.title}: ${v.msg}`).join('\n') + '\n' });

    dl(zip(files), baseName(doc, '', report.pass ? '_PRINT-PACKAGE.zip' : '_PROOF-PACKAGE.zip'));
    return { ok: true, report, forced: !report.pass };
  }

  async function exportBatch(master, docs, dpi, boardId) {
    const files = []; const results = [];
    for (const d of docs) {
      const { report } = gate(master, d, 'proof');
      results.push({ doc: d, report });
      if (!report.pass) continue;
      const r = await raster(master, d, boardId, dpi, { bleed: true });
      files.push({ name: baseName(d, boardId, `_${dpi}dpi.png`), data: new Uint8Array(await r.blob.arrayBuffer()) });
    }
    files.push({ name: '_batch-report.json', data: JSON.stringify(results.map(r => ({
      sku: r.doc.sku, name: r.doc.name, pass: r.report.pass,
      blocking: r.report.blocking.map(v => v.rule)
    })), null, 2) });
    dl(zip(files), `PEPTIDEX_BATCH_${docs.length}_${dpi}dpi.zip`);
    return results;
  }

  return { raster, svg, exportPNG, exportSVG, exportPackage, exportBatch, gate, zip, dl, validationReport, manufacturingSpec, baseName };
})();

/* ============================================================================
   package: @px/persist
   Content-addressed store, autosave (delta), named versions, crash recovery.
   depends on: core-model, state
   ============================================================================ */
const PERSIST = (() => {
  'use strict';

  const K = {
    projects: 'pxls.projects.v3',
    session: 'pxls.session.v3',
    recovery: 'pxls.recovery.v3',
    versions: 'pxls.versions.v3',
    prefs: 'pxls.prefs.v3'
  };

  const read = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

  /* ---- projects -------------------------------------------------------- */
  const listProjects = () => read(K.projects, []);
  function saveProject(doc, masterKey) {
    const all = listProjects();
    const rec = {
      id: doc.id, name: doc.name, sku: doc.sku, master: masterKey,
      compound: doc.bindings.compound, dosage: doc.bindings.dosage, lot: doc.bindings.lot,
      updatedAt: new Date().toISOString(), doc: CORE.clone(doc)
    };
    const i = all.findIndex(p => p.id === doc.id);
    if (i >= 0) all[i] = rec; else all.unshift(rec);
    write(K.projects, all.slice(0, 200));
    return rec;
  }
  function deleteProject(id) { write(K.projects, listProjects().filter(p => p.id !== id)); }
  const getProject = id => listProjects().find(p => p.id === id) || null;

  /* ---- named versions (checkpoints) ------------------------------------ */
  const listVersions = docId => read(K.versions, {})[docId] || [];
  function saveVersion(doc, masterKey, label) {
    const all = read(K.versions, {});
    const arr = all[doc.id] || [];
    arr.unshift({
      v: doc.version, label: label || ('v' + doc.version), at: new Date().toISOString(),
      master: masterKey, snapshot: CORE.clone(doc)
    });
    all[doc.id] = arr.slice(0, 40);
    write(K.versions, all);
    return arr[0];
  }
  function deleteVersions(docId) { const all = read(K.versions, {}); delete all[docId]; write(K.versions, all); }

  /* ---- autosave + crash recovery --------------------------------------- */
  let timer = null, lastMs = 0;
  function autosave(doc, masterKey) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      const t0 = performance.now();
      write(K.recovery, { at: Date.now(), master: masterKey, doc: CORE.clone(doc), audit: STATE.auditLog().slice(-80) });
      saveProject(doc, masterKey);
      lastMs = performance.now() - t0;
      STATE.bus.emit('persist:saved', { ms: lastMs });
    }, 400);
  }
  const recovery = () => read(K.recovery, null);
  const clearRecovery = () => { try { localStorage.removeItem(K.recovery); } catch (e) { } };
  const autosaveMs = () => lastMs;

  /* ---- preferences ------------------------------------------------------ */
  const prefs = () => read(K.prefs, {});
  function setPref(k, v) { const p = prefs(); p[k] = v; write(K.prefs, p); }

  /* ---- portable project file (.pxlabel) --------------------------------- */
  function exportProjectFile(doc, master) {
    const payload = {
      format: 'pxlabel', schemaVersion: CORE.SCHEMA_VERSION, engine: CORE.ENGINE_VERSION,
      exportedAt: new Date().toISOString(),
      master: { key: master.key, sha256: master.sha256, line: master.line, grade: master.graded },
      document: doc,
      versions: listVersions(doc.id).map(v => ({ v: v.v, label: v.label, at: v.at })),
      audit: STATE.auditLog()
    };
    EXPORTER.dl(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
      EXPORTER.baseName(doc, '', '.pxlabel.json'));
  }

  function importProjectFile(text) {
    const p = JSON.parse(text);
    if (p.format !== 'pxlabel') throw new Error('Not a .pxlabel file.');
    if (p.schemaVersion > CORE.SCHEMA_VERSION) throw new Error('File was written by a newer version of Label Studio.');
    const master = MASTERS.all().find(m => m.sha256 === p.master.sha256) || MASTERS.byKey(p.master.key);
    if (!master) throw new Error('Master “' + p.master.key + '” is not in this registry.');
    if (master.sha256 !== p.master.sha256)
      return { doc: p.document, master, warning: 'Master hash differs from the file — the registry artwork may have been updated.' };
    return { doc: p.document, master };
  }

  /* ---- storage report --------------------------------------------------- */
  function usage() {
    let bytes = 0;
    for (const k of Object.values(K)) { const v = localStorage.getItem(k); if (v) bytes += v.length; }
    return { bytes, projects: listProjects().length };
  }

  return {
    listProjects, saveProject, deleteProject, getProject,
    listVersions, saveVersion, deleteVersions,
    autosave, recovery, clearRecovery, autosaveMs,
    prefs, setPref, exportProjectFile, importProjectFile, usage
  };
})();

(() => {

  /* ---------- toasts ---------------------------------------------------- */
  function toast(title, msg, kind) {
    const t = el('div', { class: 'toast ' + (kind || '') }, el('b', {}, title), el('span', { html: esc(msg || '') }));
    $('#toasts').appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s,transform .3s'; t.style.opacity = 0; t.style.transform = 'translateX(20px)'; setTimeout(() => t.remove(), 320); }, kind === 'err' ? 6500 : 3400);
  }

  /* ---------- modal ------------------------------------------------------ */
  let modalStack = [];
  function modal(o) {
    const scrim = el('div', { class: 'scrim', onclick: e => { if (e.target === scrim) close(); } });
    const body = el('div', { class: 'mbody' });
    if (typeof o.body === 'string') body.innerHTML = o.body; else body.appendChild(o.body);
    const foot = el('div', { class: 'mfoot' });
    (o.buttons || [{ label: 'Close' }]).forEach(b => foot.appendChild(el('button', {
      class: 'btn ' + (b.kind || ''), onclick: () => { if (!b.action || b.action() !== false) close(); }
    }, b.label)));
    const m = el('div', { class: 'modal ' + (o.wide ? 'wide' : '') },
      el('div', { class: 'mhead' }, el('div', {}, el('h3', {}, o.title), o.sub ? el('p', { html: esc(o.sub) }) : null),
        el('button', { class: 'iconbtn x', onclick: () => close(), title: 'Close', html: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' })),
      body, foot);
    scrim.appendChild(m); $('#modals').appendChild(scrim);

    function close() { scrim.remove(); modalStack = modalStack.filter(x => x !== scrim); }

  /* ======================================================================
     CANVAS
     ====================================================================== */
  const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
  let scene = null, report = null, viewW = 0, viewH = 0, dpr = 1;

  function currentBoard() {
    if (!scene) return null;
    return scene.artboards.find(a => a.id === S.artboard) || scene.artboards[0] || null;
  }

  function fit() {
    const b = currentBoard(); if (!b) return;
    const pad = 56;
    const s = Math.min((viewW - pad) / b.w, (viewH - pad) / b.h);
    S.zoom = Math.max(0.02, Math.min(64, s));
    S.panX = (viewW - b.w * S.zoom) / 2;
    S.panY = (viewH - b.h * S.zoom) / 2;
    paint();
  }

  function zoomAt(factor, cx, cy) {
    const b = currentBoard(); if (!b) return;
    const z0 = S.zoom, z1 = Math.max(0.02, Math.min(64, z0 * factor));
    if (z1 === z0) return;
    S.panX = cx - (cx - S.panX) * (z1 / z0);
    S.panY = cy - (cy - S.panY) * (z1 / z0);
    S.zoom = z1; paint();
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    viewW = r.width; viewH = r.height; dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(viewW * dpr)); cv.height = Math.max(1, Math.round(viewH * dpr));
    const rh = $('#rhc'), rv = $('#rvc');
    rh.width = Math.round(viewW * dpr); rh.height = Math.round(22 * dpr);
    rv.width = Math.round(22 * dpr); rv.height = Math.round(viewH * dpr);
    paint();
  }

  let lastFrameMs = 0;
  function paint() {
    const t0 = performance.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, viewW, viewH);
    const b = currentBoard();
    if (!b) { lastFrameMs = performance.now() - t0; return; }

    /* checkerboard-free workspace ground + artboard shadow */
    const z = S.zoom, ox = S.panX, oy = S.panY;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 26 * Math.min(z, 2); ctx.shadowOffsetY = 8;
    ctx.fillStyle = b.bg; ctx.fillRect(ox, oy, b.w * z, b.h * z);
    ctx.restore();

    const bleedPx = (S.bleed && b.source === 'master') ? CORE.mm2px(CORE.BLEED_MM) : (S.bleed ? CORE.mm2px(CORE.BLEED_MM) : 0);
    ENGINE.CanvasRenderer.draw(ctx, b, {
      scale: z, ox, oy, guides: S.guides, slotBoxes: S.slotBoxes, selected: S.selected,
      finish: S.finish, laminate: STATE.getDoc().finishes.laminate, bleedPx, proof: S.proof
    });
    if (S.grid) drawGrid(b, z, ox, oy);
    drawRulers(b, z, ox, oy);
    lastFrameMs = performance.now() - t0;
    const zt = (z * 100 < 10 ? (z * 100).toFixed(1) : Math.round(z * 100)) + '%';
    $('#zVal').textContent = zt;
    const zfield = document.querySelector('.zoomfield');
    if (zfield && document.activeElement !== zfield) zfield.value = zt;
    if (S.stats) updStats(b);
  }

  function drawGrid(b, z, ox, oy) {
    const step = CORE.mm2px(5) * z;
    if (step < 6) return;
    ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, b.w * z, b.h * z); ctx.clip();
    ctx.strokeStyle = 'rgba(143,155,176,.22)'; ctx.lineWidth = 1;
    for (let x = ox; x <= ox + b.w * z; x += step) { ctx.moveTo(x + .5, oy); ctx.lineTo(x + .5, oy + b.h * z); }
    for (let y = oy; y <= oy + b.h * z; y += step) { ctx.moveTo(ox, y + .5); ctx.lineTo(ox + b.w * z, y + .5); }
    ctx.stroke(); ctx.restore();
  }

  function drawRulers(b, z, ox, oy) {
    const cs = getComputedStyle(document.documentElement);
    const ink3 = cs.getPropertyValue('--ink3').trim() || '#5f6879';
    const acc = cs.getPropertyValue('--accent').trim() || '#5b8cff';
    const pxPerMM = CORE.PPM * z;
    let stepMM = 1;
    for (const s of [1, 2, 5, 10, 20, 50, 100]) { if (s * pxPerMM >= 42) { stepMM = s; break; } stepMM = s; }
    const draw = (c, horiz, len) => {
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, horiz ? viewW : 22, horiz ? 22 : viewH);
      c.fillStyle = ink3; c.strokeStyle = ink3; c.lineWidth = 1;
      c.font = '9px ' + BRAND.STACK.mono;
      const origin = horiz ? ox : oy;
      const mm0 = Math.floor(-origin / pxPerMM / stepMM) * stepMM;
      const mm1 = mm0 + (len / pxPerMM) + stepMM * 2;
      c.beginPath();
      for (let mm = mm0; mm <= mm1; mm += stepMM) {
        const p = origin + mm * pxPerMM;
        if (p < -30 || p > len + 30) continue;
        if (horiz) { c.moveTo(p + .5, 15); c.lineTo(p + .5, 22); c.fillText(String(mm), p + 2.5, 11); }
        else { c.moveTo(15, p + .5); c.lineTo(22, p + .5); c.save(); c.translate(11, p - 2.5); c.rotate(-Math.PI / 2); c.fillText(String(mm), 0, 0); c.restore(); }
      }
      c.stroke();
      /* trim highlight */
      c.strokeStyle = acc; c.lineWidth = 2; c.beginPath();
      if (horiz) { c.moveTo(ox, 21); c.lineTo(ox + b.w * z, 21); } else { c.moveTo(21, oy); c.lineTo(21, oy + b.h * z); }
      c.stroke();
    };
    draw($('#rhc').getContext('2d'), true, viewW);
    draw($('#rvc').getContext('2d'), false, viewH);
  }

  function updStats(b) {
    const m = STATE.getMaster();
    $('#stats').innerHTML =
      `frame  ${lastFrameMs.toFixed(1)} ms<br>` +
      `zoom   ${(S.zoom * 100).toFixed(1)} %<br>` +
      `board  ${b.w}×${b.h} px · ${b.source}<br>` +
      `ppi    ${CORE.round(CORE.NATIVE_PPI * 1, 1)} native / ${CORE.round(CORE.NATIVE_PPI * S.zoom, 1)} on screen<br>` +
      `prims  ${b.prims.length}<br>` +
      `hist   ${STATE.getHistory().length} cmd · autosave ${PERSIST.autosaveMs().toFixed(1)} ms<br>` +
      `master ${m.sha256.slice(0, 12)}…`;
  }

  /* ---- stage interaction ------------------------------------------------ */
  let panning = false, spaceDown = false, px0 = 0, py0 = 0;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    if (e.ctrlKey || e.metaKey || !e.shiftKey) {
      zoomAt(Math.pow(0.9985, e.deltaY * (e.ctrlKey ? 3 : 1.4)), cx, cy);
    } else { S.panX -= e.deltaX; S.panY -= e.deltaY; paint(); }
  }, { passive: false });

  stage.addEventListener('pointerdown', e => {
    const r = stage.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    if (e.button === 1 || spaceDown || e.altKey) {
      panning = true; px0 = cx - S.panX; py0 = cy - S.panY;
      stage.setPointerCapture(e.pointerId); stage.style.cursor = 'grabbing'; return;
    }
    /* hit-test slots */
    const b = currentBoard(); if (!b) return;
    const bx = (cx - S.panX) / S.zoom, by = (cy - S.panY) / S.zoom;
    let hit = null;
    for (const pr of b.prims) {
      if (!pr.slot) continue;
      const f = pr.frame || { x: pr.x, y: pr.y, w: pr.size, h: pr.size };
      if (bx >= f.x && bx <= f.x + f.w && by >= f.y && by <= f.y + f.h) hit = pr.slot;
    }
    if (hit) { S.selected = hit; buildRight(); paint(); const i = document.getElementById('sf-' + hit); if (i) i.focus(); }
  });
  stage.addEventListener('pointermove', e => {
    if (!panning) return;
    const r = stage.getBoundingClientRect();
    S.panX = e.clientX - r.left - px0; S.panY = e.clientY - r.top - py0; paint();
  });
  const endPan = () => { panning = false; stage.style.cursor = spaceDown ? 'grab' : 'default'; };
  stage.addEventListener('pointerup', endPan); stage.addEventListener('pointercancel', endPan);
  stage.addEventListener('dblclick', () => fit());

  }
  const closeMenus = () => document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
  document.addEventListener('click', closeMenus);

  function slotCard(d, doc) {
    const editable = BRAND.Policy.canEdit(d.key, S.mode);
    const enabled = d.artboard === 'front' ? true : doc.enabled[d.key] !== false;
    const card = el('div', { class: 'slot' + (S.selected === d.key ? ' sel' : '') + (editable ? '' : ' locked') });
    const head = el('div', { class: 'slothead' }, el('b', {}, d.label));
    if (d.required) head.appendChild(el('span', { class: 'tag req' }, 'REQUIRED'));
    head.appendChild(el('span', { class: 'tag' }, d.type.toUpperCase()));
    head.appendChild(el('span', { class: 'lk', html: editable ? ICO.open : ICO.lock, title: editable ? 'Editable in this mode' : 'Locked in this mode' }));
    card.appendChild(head);

    if (d.artboard === 'back') {
      card.appendChild(el('label', { class: 'chk' },
        el('input', { type: 'checkbox', checked: enabled, onchange: e => STATE.invoke('slot.toggle', { key: d.key, on: e.target.checked }) }),
        'Include on the data panel'));
    }

    const val = doc.bindings[d.key] || '';
    const input = el('input', {
      class: 'inp mono', id: 'sf-' + d.key, value: val, disabled: !editable || !enabled,
      maxlength: d.maxChars, placeholder: d.key === 'qr' ? ENGINE.qrPayload(doc) : '—',
      onfocus: () => { S.selected = d.key; paint(); document.querySelectorAll('.slot').forEach(x => x.classList.remove('sel')); card.classList.add('sel'); },
      oninput: e => {
        const v = CORE.normalise(d, e.target.value);
        const r = STATE.invoke('slot.setValue', { key: d.key, value: v });
        if (!r.ok) { e.target.classList.add('err'); toast('Rejected', r.violations[0].msg, 'err'); }
        else e.target.classList.remove('err');
      }
    });
    card.appendChild(input);
    if (d.hint) card.appendChild(el('div', { class: 'hint' }, d.hint));

    if (d.typography) {
      const ty = d.typography;
      card.appendChild(el('div', { class: 'slotmeta' },
        el('span', {}, 'cap ' + ty.capPx + 'px / ' + CORE.round(CORE.px2mm(ty.capPx), 2) + 'mm'),
        el('span', {}, 'track ' + ty.tracking),
        el('span', {}, 'w' + ty.weight),
        el('span', {}, 'max ' + d.maxChars + ' ch')));
    } else if (d.type === 'qr') {
      const b = currentBoardPrim('qr');
      card.appendChild(el('div', { class: 'slotmeta' },
        el('span', {}, b ? b.n + '×' + b.n + ' modules' : 'not rendered'),
        el('span', {}, b ? 'module ' + b.moduleMM.toFixed(2) + ' mm' : ''),
        el('span', {}, 'EC-L')));
      card.appendChild(el('div', { class: 'hint' }, 'Leave empty to auto-derive a verification URL from the serial.'));
    }
    return card;
  }
  function currentBoardPrim(t) {
    if (!scene) return null;
    for (const a of scene.artboards) { const p = a.prims.find(x => x.t === t); if (p) return p; }
    return null;
  }

  function renderPreflight(b) {
    b.innerHTML = '';
    if (!report) return;
    const g = el('div', { class: 'gauge' },
      el('div', {}, el('b', { class: report.blocking.length ? 'b' : 'g' }, String(report.blocking.length)), el('s', {}, 'blocking')),
      el('div', {}, el('b', { class: report.warnings.length ? 'w' : '' }, String(report.warnings.length)), el('s', {}, 'warnings')),
      el('div', {}, el('b', {}, String(report.infos.length)), el('s', {}, 'info')));
    b.appendChild(g);
    b.appendChild(el('div', { class: 'note ' + (report.pass ? 'ok' : 'err'), style: 'margin-top:0' },
      el('b', {}, report.pass ? 'Proof export unlocked. ' : 'Export gate closed. '),
      report.pass
        ? 'No blocking violations for proof output. Production output still requires vector masters with separations.'
        : 'The exporter will not write a file while blocking violations remain.'));
    const order = { blocking: 0, warning: 1, info: 2 };
    for (const v of [...report.violations].sort((a, z) => order[a.severity] - order[z.severity])) {
      const row = el('div', { class: 'pf ' + v.severity },
        el('div', { class: 'ic', html: v.severity === 'blocking' ? ICO.err : v.severity === 'warning' ? ICO.warn : ICO.info }),
        el('div', { class: 'tx' }, el('b', {}, v.title), el('p', { html: esc(v.msg) }),
          el('code', {}, v.rule + ' · ' + (v.boardLabel || v.board) + (v.detail ? ' · ' + v.detail : ''))));
      if (v.slot) row.appendChild(el('button', {
        class: 'fix', onclick: () => {
          const d = CORE.slotDef(v.slot); if (!d) return;
          S.artboard = d.artboard; S.selected = v.slot; buildRight(); paint();
          const i = document.getElementById('sf-' + v.slot); if (i) { i.focus(); i.select && i.select(); }
        }
      }, 'Go'));
      b.appendChild(row);
    }
  }

  function renderHistory(b) {
    b.innerHTML = '';

    if (!h.length) { b.appendChild(el('div', { class: 'empty' }, 'No changes yet.')); return; }
    const list = el('div', { class: 'hist' });
    h.slice(-120).forEach(r => list.appendChild(el('div', { class: 'hrec' + (r.undone ? ' undone' : '') },
      el('span', { class: 't' }, new Date(r.at).toLocaleTimeString()),
      el('span', { class: 'd' }, r.label))));

  function buildStatus() {
    const doc = STATE.getDoc(), m = STATE.getMaster();
