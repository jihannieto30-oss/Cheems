<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none" role="presentation">

  <defs>
    <!-- Matte: the covering is a pressed mineral flux, so the highlight is
         broad and dull. A tight specular reads as chromed tube instead. -->
    <linearGradient id="flux" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#100f0d"/>
      <stop offset="20%" stop-color="#4a453d"/>
      <stop offset="40%" stop-color="#8b8478"/>
      <stop offset="58%" stop-color="#6a655c"/>
      <stop offset="82%" stop-color="#26241f"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      
    <stop offset="0%" stop-color="#1c1c1c"/>
    <stop offset="18%" stop-color="#6e6e6e"/>
    <stop offset="34%" stop-color="#a8a8a8"/>
    <stop offset="46%" stop-color="#6e6e6e"/>
    <stop offset="78%" stop-color="#1c1c1c"/>
    <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="55%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#343434"/>
      <stop offset="45%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="eFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    
  <radialGradient id="vige" cx="50%" cy="50%" r="72%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
  </radialGradient>
    
  <filter id="gre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
  </filter>
  </defs>

  <rect width="1600" height="1000" fill="#000"/>
  <ellipse cx="720" cy="850" rx="540" ry="56" fill="#000" fill-opacity="0.85"/>

  <g transform="translate(230,600) rotate(-13)">
    <!-- carton behind and below the sticks -->
    <path d="M250 -186 L1040 -186 L1040 250 L250 250 Z" fill="url(#boxFront)"/>
    <path d="M250 250 L1040 250" stroke="#fff" stroke-opacity="0.09" stroke-width="2"/>

    <g><g transform="translate(0,99.42)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.05"/><rect x="-118" y="-10.8" width="122" height="21.6" fill="url(#core)"/><ellipse cx="-118" cy="0" rx="4.32" ry="10.8" fill="#6f6b64"/><ellipse cx="0" cy="0" rx="8.1" ry="27" fill="#8d8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g><g transform="translate(61,104.35)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.05"/><rect x="-118" y="-10.8" width="122" height="21.6" fill="url(#core)"/><ellipse cx="-118" cy="0" rx="4.32" ry="10.8" fill="#6f6b64"/><ellipse cx="0" cy="0" rx="8.1" ry="27" fill="#8d8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g><g transform="translate(122,104.52)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.05"/><rect x="-118" y="-10.8" width="122" height="21.6" fill="url(#core)"/><ellipse cx="-118" cy="0" rx="4.32" ry="10.8" fill="#6f6b64"/><ellipse cx="0" cy="0" rx="8.1" ry="27" fill="#8d8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g><g transform="translate(27,49.55)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.05"/><rect x="-118" y="-10.8" width="122" height="21.6" fill="url(#core)"/><ellipse cx="-118" cy="0" rx="4.32" ry="10.8" fill="#6f6b64"/><ellipse cx="0" cy="0" rx="8.1" ry="27" fill="#8d8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g><g transform="translate(88,53.76)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.0