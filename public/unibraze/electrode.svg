8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g><g transform="translate(122,1.51)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.05"/><rect x="-118" y="-10.8" width="122" height="21.6" fill="url(#core)"/><ellipse cx="-118" cy="0" rx="4.32" ry="10.8" fill="#6f6b64"/><ellipse cx="0" cy="0" rx="8.1" ry="27" fill="#8d8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g><g transform="translate(183,-1.57)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.05"/><rect x="-118" y="-10.8" width="122" height="21.6" fill="url(#core)"/><ellipse cx="-118" cy="0" rx="4.32" ry="10.8" fill="#6f6b64"/><ellipse cx="0" cy="0" rx="8.1" ry="27" fill="#8d8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g><g transform="translate(244,-0.1)"><rect x="0" y="-27" width="980" height="54" fill="url(#flux)"/><rect x="0" y="-14.04" width="980" height="1.4" fill="#fff" fill-opacity="0.05"/><rect x="-118" y="-10.8" width="122" height="21.6" fill="url(#core)"/><ellipse cx="-118" cy="0" rx="4.32" ry="10.8" fill="#6f6b64"/><ellipse cx="0" cy="0" rx="8.1" ry="27" fill="#8d8880"/><ellipse cx="-1.62" cy="-8.1" rx="3.51" ry="9.18" fill="#fff" fill-opacity="0.14"/></g></g>
    <rect x="220" y="-230" width="980" height="520" fill="url(#eFade)"/>

    <!-- lid, brand rule and legend -->
    <path d="M232 -188 L1060 -188 L1060 -84 L232 -84 Z" fill="url(#boxLid)"/>
    <path d="M232 -188 L1060 -188" stroke="#fff" stroke-opacity="0.2" stroke-width="2.5"/>
    <path d="M232 -84 L1060 -84" stroke="#000" stroke-opacity="0.9" stroke-width="3"/>
    <rect x="470" y="-124" width="440" height="6" fill="#e10600"/>
    <text x="470" y="-140" fill="#fff" fill-opacity="0.62" font-family="ui-monospace,monospace" font-size="28" letter-spacing="8">WELDING ELECTRODES</text>
  </g>

  <rect width="1600" height="1000" fill="url(#vige)"/>
  <rect width="1600" height="1000" filter="url(#gre)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
