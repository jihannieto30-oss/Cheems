<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>PEPTIDEX · Fichas Técnicas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --nav1:#0f275e; --nav2:#1b449b;          /* la barra de sección, medida del documento */
  --ink:#101010; --ink2:#3a3f46; --muted:#8a9099; --hair:#dcdfe4;
  --bg:#eef0f3; --paper:#ffffff; --edit:#1e5eff;
  --font:Arial,"Helvetica Neue",Helvetica,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}

/* ---------- barra de herramientas ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--hair)}
.topin{max-width:1400px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:13px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand img{height:28px;width:auto;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.2}
.brand .bt b{font-size:12px;font-weight:700;letter-spacing:.03em}
.brand .bt span{font-size:9px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;font-weight:700}
.search{flex:1;position:relative;max-width:300px}
.search input{width:100%;font-family:inherit;font-size:13.5px;padding:8px 14px 8px 34px;
  border:1px solid var(--hair);border-radius:999px;background:#f7f8fa;outline:none}
.search input:focus{border-color:var(--nav1);background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4}
.filters{display:flex;gap:5px;flex-shrink:0}
.filters button{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.05em;
  padding:7px 12px;border-radius:999px;border:1px solid var(--hair);background:#fff;
  color:var(--ink2);cursor:pointer;white-space:nowrap}
.filters button:hover{border-color:var(--nav1)}
.filters button.on{background:var(--nav1);border-color:var(--nav1);color:#fff}
.acts{display:flex;gap:5px;flex-shrink:0;align-items:center;margin-left:auto}
.btn{font-family:inherit;font-size:11px;font-weight:700;padding:7px 12px;border-radius:999px;
  border:1px solid var(--hair);background:#fff;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--nav1)}
.btn.dark{background:var(--nav1);border-color:var(--nav1);color:#fff}
.saved{font-size:10.5px;color:var(--muted);min-width:92px;text-align:right}

/* ---------- layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 80px;display:grid;
  grid-template-columns:236px 1fr;gap:30px;align-items:start}
.rail{position:sticky;top:62px;max-height:calc(100vh - 78px);overflow-y:auto;padding-bottom:30px;
  scrollbar-width:thin;background:#fff;border:1px solid var(--hair);border-radius:10px;padding:14px 8px}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:#cfd4da;border-radius:3px}
.ng{margin-bottom:16px}
.ngt{display:block;font-size:9px;font-weight:800;letter-spacing:.2em;padding:0 8px 7px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;text-decoration:none;
  color:var(--ink2);font-size:12.5px}
.ni:hover{background:#f1f3f6;color:var(--ink)}
.ni.act{background:var(--nav1);color:#fff}
.ni.act .nn{color:rgba(255,255,255,.65)}
.nn{font-family:var(--mono);font-size:9.5px;color:var(--muted);flex-shrink:0;width:16px}
.nname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nsz{font-size:12px;color:var(--edit);flex-shrink:0;width:8px;line-height:1}
.col{min-width:0}

/* ============================ LA FICHA ============================ */
.ficha{background:var(--paper);border:1px solid var(--hair);border-radius:4px;
  padding:34px 40px 30px;margin-bottom:26px;scroll-margin-top:74px;position:relative;
  box-shadow:0 10px 34px -28px rgba(10,20,60,.5)}

/* --- cabecera: logo maestro, FICHA TÉCNICA, nombre, RUO, tira de línea --- */
.fx-head{text-align:center;padding-bottom:16px}
.fx-master{height:74px;width:auto;display:block;margin:0 auto 14px}
.fx-kick{font-size:10px;font-weight:700;letter-spacing:.42em;color:var(--nav1);
  text-transform:uppercase;margin-bottom:4px}
.fx-ruo{display:inline-block;border:1px solid var(--nav1);color:var(--nav1);border-radius:999px;
  padding:3px 16px;font-size:8.5px;font-weight:700;letter-spacing:.22em;margin-top:10px}
.fx-strip{margin-top:16px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:9px 0;display:flex;align-items:center;justify-content:center;gap:16px}
.fx-strip>div{flex:0 1 560px;min-width:0}
.fx-linelogo{height:44px;width:auto;display:block;flex-shrink:0}

/* --- barra de sección --- */
.fx-sec{display:flex;align-items:center;gap:11px;margin:20px 0 10px;padding:6px 12px;
  background:linear-gradient(90deg,var(--nav1),var(--nav2));border-radius:2px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.fx-n{flex-shrink:0;width:17px;height:17px;border-radius:50%;border:1px solid rgba(255,255,255,.85);
  color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  line-height:1}
.fx-sec .f{color:#fff}
.fx-sec .f:hover{border-bottom-color:rgba(255,255,255,.5)}
.fx-sec .f:focus{border-bottom-color:#fff;background:rgba(255,255,255,.12)}

/* --- tabla de composición --- */
.fx-tab{width:100%;border-collapse:collapse;margin-top:2px}
.fx-tab td{border:1px solid var(--hair);padding:6px 10px;vertical-align:top}
.fx-tab td.kk{width:32%;background:#f6f7f9;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* --- viñetas --- */
.fx-ul{padding-left:2px}
.fx-blank{border:1px dashed #c9cfd8;border-radius:4px;padding:8px 11px;background:#fcfdff}

/* --- aviso legal --- */
.fx-legal{margin-top:24px;padding-top:12px;border-top:1px solid var(--hair);text-align:center}

/* --- acciones por ficha --- */
.fx-tools{position:absolute;top:10px;right:12px;display:flex;gap:5px;align-items:center}
.fbtn{border:1px solid var(--hair);background:#fff;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  padding:3px 7px;text-transform:uppercase}
.fbtn:hover{border-color:var(--nav1);color:var(--nav1)}
.fbtn.del:hover{border-color:#c0392b;color:#c0392b;background:#fdf2f0}
.lsel{font-size:8.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);background:#fff;
  border:1px solid var(--hair);border-radius:6px;padding:3px 6px;font-family:inherit;cursor:pointer}
.badge{position:absolute;top:13px;left:14px;font-size:8px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--edit);display:none}
.ficha.dirty .badge{display:block}

/* ---------- campos editables ----------
   El campo no se anuncia hasta que se le acerca el cursor: en reposo la ficha
   se lee exactamente como el documento impreso, y sólo al pasar por encima
   aparece el subrayado que dice «esto se puede escribir». */
.f{width:100%;font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;
  font-weight:inherit;letter-spacing:inherit;text-align:inherit;text-transform:inherit;
  background:transparent;border:none;border-bottom:1px dashed transparent;padding:0;
  outline:none;resize:none;overflow:hidden;display:block;transition:border-color .15s,background .15s}
.f:hover{border-bottom-color:#d8dce2}
.f:focus{border-bottom-color:var(--edit);background:#f5f8ff}
.f::placeholder{color:#b9c0c9;font-style:italic;font-weight:400;letter-spacing:0;text-transform:none}
.f-name{font-size:27px;font-weight:700;letter-spacing:.02em;line-height:1.14;text-align:center;
  text-transform:uppercase;color:var(--ink)}
.f-sub{font-size:11.5px;color:var(--ink2);line-height:1.45;text-align:center;margin-top:4px}
.f-strip{font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--nav1);text-align:center;
  text-transform:uppercase}
.f-sect{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.f-body{font-size:12.5px;line-height:1.62;color:var(--ink2);text-align:justify}
.f-cell{font-size:11.5px;line-height:1.5;color:var(--ink2)}
.f-cellk{font-size:11.5px;line-height:1.5;color:var(--ink);font-weight:700}
.f-list{font-size:12.5px;line-height:1.62;color:var(--ink2)}
.f-legal{font-size:9px;line-height:1.5;color:var(--ink2);font-style:italic;font-weight:700;
  text-align:center}
.hint{font-size:8.5px;color:#b9c0c9;letter-spacing:.04em;margin-top:2px;display:block}

/* ---------- espejo de impresión ---------- */
.m{display:none;white-space:pre-wrap;word-wrap:break-word}
.lw{position:relative;cursor:text;border-bottom:1px dashed transparent;border-radius:2px}
.lw:hover{border-bottom-color:#d8dce2}
.lw .m{display:block}
.lw.on .m{display:none}
.lw .f{display:none}
.lw.on .f{display:block}
.lw .m:empty::before{content:attr(data-ph);color:#b9c0c9;font-style:italic}
.m ul{list-style:none}
.m li{padding-left:15px;position:relative;margin-bottom:3px}
.m-list li{margin-bottom:1.5px}
.m li::before{content:"\25cf";position:absolute;left:0;top:0;font-size:.72em;line-height:1.85;
  color:var(--nav1)}

.empty{padding:64px 20px;text-align:center;color:var(--muted);font-size:14px;display:none;
  background:#fff;border:1px solid var(--hair);border-radius:4px}

@media(max-width:1040px){
  .wrap{grid-template-columns:1fr;gap:0}
  .rail{display:none}
  .ficha{padding:22px 18px}
  .fx-tab td.kk{width:38%}
}
@media(max-width:820px){
  .topin{flex-wrap:wrap;gap:8px;padding:10px 14px}
  .search{order:3;max-width:none;flex-basis:100%}
  .filters,.acts{flex-wrap:wrap}.acts{margin-left:0}
  .wrap{padding:16px 14px 60px}
  .fx-strip{flex-direction:column;gap:8px}
  .fx-tab,.fx-tab tbody,.fx-tab tr,.fx-tab td{display:block;width:100%}
  .fx-tab td.kk{width:100%;border-bottom:none}
}

/* ============================================================================
   IMPRESIÓN — una ficha por página, que es como está pensado el documento.

   Dos cosas que hay que forzar aquí y que no se ven en pantalla.  La hoja Carta
   con márgenes mide unos 718 px de CSS, por debajo del punto de ruptura de
   móvil: sin forzarlo, el papel heredaría la disposición de teléfono y la tabla
   de composición se desmontaría en bloques apilados.  Y los textarea se
   imprimen con la altura que midieron en pantalla, así que se imprimen los
   espejos en su lugar.
   ============================================================================ */
@page{size:Letter;margin:10mm 11mm 8mm}
@media print{
  .top,.rail,.fx-tools,.hint,.badge{display:none !important}
  body{background:#fff;font-size:8.8pt}
  .wrap{display:block;padding:0;max-width:none}
  .ficha{border:none;border-radius:0;box-shadow:none;padding:0 0 6pt;margin:0;
    page-break-after:always;page-break-inside:auto}
  .ficha:last-of-type{page-break-after:auto}
  .empty{display:none !important}

  .f{display:none !important}
  .m{display:block}
  .m-name{font-size:15pt;font-weight:700;letter-spacing:.02em;line-height:1.12;text-align:center;
    text-transform:uppercase}
  .m-sub{font-size:7.8pt;color:var(--ink2);text-align:center;margin-top:3pt;line-height:1.4}
  .m-strip{font-size:7pt;font-weight:700;letter-spacing:.28em;color:var(--nav1);text-align:center;
    text-transform:uppercase}
  .m-sect{font-size:7.8pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff}
  .m-body,.m-list{font-size:7.9pt;line-height:1.34;color:var(--ink2);text-align:justify}
  .m-cell{font-size:7.5pt;color:var(--ink2)}
  .m-cellk{font-size:7.5pt;color:var(--ink);font-weight:700}
  .m-legal{font-size:6.2pt;line-height:1.4;font-style:italic;font-weight:700;text-align:center;
    color:var(--ink2)}

  .fx-head{padding-bottom:6pt}
  .fx-master{height:34pt;margin-bottom:5pt}
  .fx-linelogo{height:22pt}
  .fx-kick{font-size:6.8pt;letter-spacing:.4em}
  .fx-ruo{font-size:6pt;padding:1.5pt 11pt;margin-top:5pt}
  .fx-strip{margin-top:7pt;padding:4pt 0}
  .fx-sec{margin:6pt 0 3pt;padding:2.6pt 8pt;page-break-after:avoid;page-break-inside:avoid}
  .m-list li,.m-body{orphans:2;widows:2}
  .fx-n{width:10.5pt;height:10.5pt;font-size:6.4pt}
  .fx-tab,.fx-tab tbody,.fx-tab tr{display:revert}
  .fx-tab{display:table;width:100%;page-break-inside:auto}
  .fx-tab tr{display:table-row;page-break-inside:avoid}
  .fx-tab td{display:table-cell;padding:2.1pt 6pt}
  .fx-tab td.kk{width:32%;border-bottom:1px solid var(--hair)}
  .fx-strip{flex-direction:row}
  /* El hueco de dosis se imprime vacío: en pantalla el texto guía dice cómo
     se escribe, pero en el papel sería una instrucción de la aplicación
     colada en un documento de cliente.  Queda el recuadro, que es el sitio
     donde se rellena a mano si hace falta. */
  .fx-blank{min-height:30pt}
  .fx-blank .m:empty::before{content:"" !important}

  /* Autoajuste.  La maqueta está pensada para una ficha por página, pero once
     de las 56 llevan bastante más texto que el resto y se pasaban por unas
     pocas líneas.  fit() las mide antes de imprimir y les baja el cuerpo un
     escalón — o dos si con uno no basta.  Es la tipografía la que cede, no la
     estructura: los márgenes, la barra y la tabla no se tocan. */
  .ficha.tight  .m-body,.ficha.tight  .m-list{font-size:7.4pt;line-height:1.3}
  .ficha.tight  .m-cell,.ficha.tight  .m-cellk{font-size:7.1pt}
  .ficha.tight  .fx-sec{margin:5pt 0 2.5pt}
  .ficha.tighter .m-body,.ficha.tighter .m-list{font-size:6.9pt;line-height:1.26}
  .ficha.tighter .m-cell,.ficha.tighter .m-cellk{font-size:6.7pt}
  .ficha.tighter .fx-sec{margin:4pt 0 2pt}
  .ficha.tighter .fx-master{height:28pt}
  .fx-legal{margin-top:7pt;padding-top:4pt}
  a{color:inherit;text-decoration:none}
}
</style>
</head>

ica sola: la proteína precipita a pH neutro. Reconstituir con ácido acético 0.01 N o con el diluyente que indique el CoA, y diluir después. Nunca agitar — agitar una proteína la desnaturaliza en la interfase aire-líquido.\nEstabilidad: Mucho menos robusta que un péptido sintético. Tres puentes disulfuro que se pueden barajar, agregación dependiente de concentración y de agitación.\nManejo: Factor de crecimiento mitogénico. Manejar con guantes; evitar aerosoles.\nVida media: ~20–30 h en circulación (frente a ~12–15 h del IGF-1 unido a IGFBP-3 y minutos del IGF-1 libre).", "riesgos": "Sin aprobación regulatoria en esta forma análoga.\nProhibido por la AMA/WADA (S2).\nRequiere cadena de frío real. Es el producto del catálogo con mayor riesgo de llegar inactivo.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "IGF-01 · IGF-1", "sizes": "0.1MG · 1MG", "cas": "946870-92-4", "cls": "Análogo recombinante de factor de crecimiento (proteína, 83 aa)", "aka": "Long R3 IGF-1, Mecasermina análoga"}, {"id": "IPA", "line": "fitness", "L": "FITNESS", "ink": "#1b1b1b", "acc": "#5b6068", "name": "Ipamorelin", "sub": "NNC 26-0161", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación de liberación pulsátil de hormona de crecimiento con mínima señal colateral. Es el secretagogo más selectivo del catálogo. e effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "APT5 · APT10", "sizes": "5MG · 10MG", "cas": "", "cls": "Péptido proapoptótico dirigido a vasculatura de tejido adiposo", "aka": "FTPP, Prohibitin-targeting peptide 1, CKGGRAKDC-GG-D(KLAKLAK)2"}, {"id": "AM", "line": "fitness", "L": "FITNESS", "ink": "#1b1b1b", "acc": "#5b6068", "name": "5-Amino-1MQ", "sub": "5-amino-1-metilquinolinio", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación del metabolismo del adipocito por la vía NNMT/NAD+. Se incluye en la línea FITNESS pese a no ser un péptido.\n\nInhibidor competitivo de la nicotinamida N-metiltransferasa, la enzima citosólica que metila nicotinamida a 1-metilnicotinamida consumiendo SAM. Su inhibición aumenta el pool de nicotinamida disponible para resíntesis de NAD+ y desplaza el metabolismo del adipocito hacia mayor gasto.", "k1": "Tipo", "v1": "Molécula pequeña — inhibidor de NNMT (no es un péptido)", "k2": "Fórmula molecular (referencia)", "v2": "C10H11N2+ (catión); C10H11IN2 como yoduro", "k3": "Peso molecular aprox.", "v3": "159.21 Da", "k4": "CAS", "v4": "42464-96-0 (sal de yoduro)", "k5": "Secuencia", "v5": "No aplica. Es un catión quinolinio de molécula pequeña.", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 5MG · 10MG · 50MG", "k7": "Contenido del vial", "v7": "Sal de yoduro o de cloruro del catión quinolinio, en polvo. Peso molecular de la sal (286.11 para el yoduro) frente al del catión (159.21): confirmar cuál reporta el CoA antes de calcular concentración.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Reducción de masa grasa y de tamaño de adipocito sin cambio en la ingesta (ratón con dieta alta en grasa).\nPromoción de diferenciación de mioblastos y de regeneración muscular in vitro.\nNO existen ensayos clínicos publicados en humano. Toda la evidencia es preclínica.\nLa inhibición de NNMT tiene implicaciones oncológicas ambivalentes: NNMT está sobreexpresada en varios tumores, pero también participa en homeostasis normal.", "dosis": "", "recom": "Almacenamiento: Polvo: −20 °C protegido de la luz. Solución: preparar fresca o alicuotar a −20 °C.\nReconstitución: Soluble en agua y en DMSO. Como molécula pequeña, no requiere las precauciones de un péptido.\nEstabilidad: Buena como sólido. El anillo quinolinio es fotosensible.\nManejo: Molécula pequeña de toxicidad no caracterizada. Manejar con guantes; evitar inhalación del polvo.\nVida media: No caracterizada en humano.", "riesgos": "Sin aprobación regulatoria. Sin datos en humano.\nNo es un péptido: los métodos analíticos de la línea (HPLC de péptidos, LC-MS de masa intacta) requieren adaptación.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "5AM · 10AM · 50AM", "sizes": "5MG · 10MG · 50MG", "cas": "42464-96-0 (sal de yoduro)", "cls": "Molécula pequeña — inhibidor de NNMT (no es un péptido)", "aka": "5-amino-1-metilquinolinio"}, {"id": "AR", "line": "fitness", "L": "FITNESS", "ink": "#1b1b1b", "acc": "#5b6068", "name": "AICAR", "sub": "Acadesina, AICA ribonucleótido, 5-aminoimidazol-4-carboxamida ribósido", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CO  "name": "SS-31", "sub": "Elamipretida, MTP-131, Bendavia", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación de disfunción mitocondrial. Es el compuesto de esta categoría con desarrollo clínico humano más avanzado.\n\nSu alternancia de residuos aromáticos y catiónicos le permite atravesar membranas y concentrarse en la membrana mitocondrial interna, donde se asocia a cardiolipina. Al hacerlo estabiliza la cristae, mejora el acoplamiento de la cadena respiratoria y reduce la producción de especies reactivas de oxígeno. No es un antioxidante que consuma radicales: reduce la fuga que los genera.", "k1": "Tipo", "v1": "Tetrapéptido dirigido a mitocondria", "k2": "Fórmula molecular (referencia)", "v2": "C32H49N9O5", "k3": "Peso molecular aprox.", "v3": "639.8 Da", "k4": "CAS", "v4": "736992-21-5", "k5": "Secuencia", "v5": "D-Arg-Dmt-Lys-Phe-NH2 (Dmt = 2,6-dimetiltirosina)", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 10MG · 50MG", "k7": "Contenido del vial", "v7": "Tetrapéptido sintético con dos residuos no naturales, liofilizado, sal de acetato. Carga positiva neta, lo que gobierna su comportamiento.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Mejora de función mitocondrial en músculo esquelético humano envejecido (fase 1/2).\nEnsayos fase 3 en miopatía mitocondrial primaria (MMPOWER-3): objetivo primario no alcanzado.\nAprobación FDA en 2025 para síndrome de Barth bajo la vía acelerada, tras un recorrido regulatorio inusualmente accidentado.\nExplorada en isquemia-reperfusión cardíaca y en enfermedad renal (fase 2).", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática. Muy soluble por la carga catiónica.\nEstabilidad: Buena. Sin cisteína ni metionina; la Dmt es más resistente a oxidación que la tirosina normal.\nManejo: Manejar como sustancia de investigación no caracterizada.\nVida media: ~2–4 h.", "riesgos": "Existe versión aprobada por FDA (síndrome de Barth); el material de investigación NO es ese producto.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "2S10 · 2S50", "sizes": "10MG · 50MG", "cas": "736992-21-5", "cls": "Tetrapéptido dirigido a mitocondria", "aka": "Elamipretida, MTP-131, Bendavia"}, {"id": "LC", "line": "fitness", "L": "FITNESS", "ink": "#1b1b1b", "acc": "#5b6068", "name": "L-Carnitine", "sub": "Levocarnitina, ácido 3-hidroxi-4-trimetilamoniobutanoico", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Transporte de ácidos grasos de cadena larga a la matriz mitocondrial. Es un nutriente esencial condicional, no un compuesto experimental.\n\nSustrato obligado del sistema carnitina-palmitoiltransferasa (CPT-1/CPT-2): sin carnitina, los ácidos grasos de cadena larga no cruzan la membrana mitocondrial interna y no se oxidan.", "k1": "Tipo", "v1": "Aminoácido cuaternario (no es un péptido)", "k2": "Fórmula molecular (referencia)", "v2": "C7H15NO3", "k3": "Peso molecular aprox.", "v3": "161.2 Da", "k4": "CAS", "v4": "541-15-1", "k5": "Secuencia", "v5": "No aplica.", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 600MG · 1200MG", "k7": "Contenido del vial", "v7": "L-carnitina en polvo o solución. Las presentaciones de 600 y 1200 MG reflejan que la dosis fisiológica es de gramos, no de microgramos.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Levocarnitina inyectable está aprobada por la FDA para deficiencia primaria y secundaria de carnitina.\nEn sujetos con carnitina normal, la suplementación no aumenta de forma consistente la oxidación de grasa (metaanálisis).\nLa forma D es tóxica y desplaza competitivamente a la L: la estereoquímica del material es un criterio de calidad crítico, no un detalle.\nLa carnitina oral se convierte parcialmente en TMAO por microbiota intestinal, con asociación epidemiológica a riesgo cardiovascular.", "dosis": "", "recom": "Almacenamiento: Polvo: seco y sellado. Muy higroscópico — la ganancia de peso por humedad es la causa más común de error de dosificación.\nReconstitución: Muy soluble e higroscópica. La forma inyectable se presenta habitualmente ya en solución.\nEstabilidad: Excelente como sólido seco.\nManejo: Riesgo bajo. Manejar con buenas prácticas de laboratorio.\nVida media: Variable; depende de reservas tisulares y de función renal.", "riesgos": "Existe versión aprobada por FDA (levocarnitina); el material de investigación NO es ese producto.\nVerificar en el CoA la pureza enantiomérica: la D-carnitina es tóxica.\nNo es un péptido.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "LC600 · LC1200", "sizes": "600MG · 1200MG", "cas": "541-15-1", "cls": "Aminoácido cuaternario (no es un péptido)", "aka": "Levocarnitina, ácido 3-hidroxi-4-trimetilamoniobutanoico"}, {"id": "MIC", "line": "fitness", "L": "FITNESS", "ink": "#1b1b1b", "acc": "#5b6068", "name": "Lipo-C + B12", "sub": "MIC-B12, inyección lipotrópica", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Formulación compuesta clásica de farmacia magistral. Es el único artículo del catálogo que se surte en solución (10 ML) y no liofilizado.\n\nMetionina es donante de metilo y precursor de S-adenosilmetionina; colina e inositol participan en el transporte de lípidos y en la síntesis de fosfolípidos; B12 es cofactor de la metionina sintasa. La lógica es sostener las vías de exportación hepática de lípidos.", "k1": "Tipo", "v1": "Mezcla en solución de compuestos lipotrópicos y vitamina B12", "k2": "Fórmula molecular (referencia)", "v2": "Sin registro público", "k3": "Peso molecular aprox.", "v3": "Sin registro público", "k4": "CAS", "v4": "Sin registro público", "k5": "Secuencia", "v5": "No aplica. Mezcla, no molécula única.", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 10ML", "k7": "Contenido del vial", "v7": "Composición variable por lote — típicamente metionina, inositol, colina (los tres «MIC») y cianocobalamina o metilcobalamina, en vehículo acuoso con conservador (habitualmente alcohol bencílico). La fórmula exacta de cada lote debe leerse en la etiqueta: no hay una definición estándar de «Lipo-C».", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "No existen ensayos clínicos controlados que demuestren pérdida de peso atribuible a inyecciones lipotrópicas.\nLa deficiencia de B12 y la de colina son entidades reales con corrección documentada; eso es distinto de la mezcla como agente adelgazante.\nEl uso es de práctica magistral, no de evidencia.", "dosis": "", "recom": "Almacenamiento: 2–8 °C, protegido de la luz — la cobalamina es marcadamente fotosensible y el color rosa del vial es su indicador visual.\nReconstitución: No requiere. Se surte en solución lista.\nEstabilidad: Limitada por la cobalamina. Una decoloración del rosa característico indica degradación.\nManejo: Contiene conservador. Verificar composición del lote antes de usar.\nVida media: Variable por componente.", "riesgos": "Formulación magistral sin estandarización: la composición varía entre lotes y fabricantes.\nSin evidencia clínica de eficacia para pérdida de peso.\nAl ser solución y no liofilizado, su vida útil es sustancialmente más corta que la del resto del catálogo.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "MIC", "sizes": "10ML", "cas": "", "cls": "Mezcla en solución de compuestos lipotrópicos y vitamina B12", "aka": "MIC-B12, inyección lipotrópica"}, {"id": "AX", "line": "fitness", "L": "FITNESS", "ink": "#1b1b1b", "acc": "#5b6068", "name": "Adamax", "sub": "Análogo de Semax adamantilado", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación de neuroprotección y de BDNF, como análogo estabilizado de Semax.\n\nAnálogo de la familia Semax/ACTH(4-10). La adamantilación aumenta lipofilia y resistencia a proteasas, con la intención de mejorar penetración de barrera hematoencefálica y duración. El mecanismo propuesto es el mismo de Semax: modulación de BDNF y de la vía melanocortinérgica.", "k1": "Tipo", "v1": "Péptido nootrópico — análogo de melanocortina/Semax", "k2": "Fórmula molecular (referencia)", "v2": "Sin registro público", "k3": "Peso molecular aprox.", "v3": "Sin registro público", "k4": "CAS", "v4": "Sin registro público", "k5": "Secuencia", "v5": "Declarado por proveedores como Ac-MEHFPGPAG-NH2 con modificación adamantilo. Las descripciones comerciales NO son consistentes entre sí.", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 10MG", "k7": "Contenido del vial", "v7": "Péptido sintético liofilizado. Ésta es la ficha con menor calidad de información pública del catálogo, y la ficha debe decirlo.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "NO existen ensayos clínicos publicados.\nNO existe una entrada de registro CAS pública ni caracterización estructural revisada por pares.\nToda la información disponible procede de descripciones de proveedores, que difieren entre sí en secuencia y en masa.\nLa evidencia de la familia (Semax) no es transferible sin datos propios.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática.\nEstabilidad: Contiene metionina: oxidable. Proteger de aire.\nManejo: Manejar como sustancia de investigación no caracterizada.\nVida media: No caracterizada.", "riesgos": "Compuesto pobremente caracterizado: sin CAS, sin literatura revisada por pares, sin consenso de estructura entre proveedores.\nExigir al proveedor masa intacta por LC-MS y secuenciación: es el único modo de saber qué contiene el vial.\nSin aprobación regulatoria.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "AX10", "sizes": "10MG", "cas": "", "cls": "Péptido nootrópico — análogo de melanocortina/Semax", "aka": "Análogo de Semax adamantilado"}, {"id": "RA", "line": "fitness", "L": "FITNESS", "ink": "#1b1b1b", "acc": "#5b6068", "name": "Ara-290", "sub": "Cibinetida, péptido de la hélice B de EPO", "strip": "LÍNEA FITNESS · BUILD PERFORMANCE", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación de neuropatía de fibra pequeña e inflamación tisular. Diseñado explícitamente para separar la protección tisular de la EPO de su efecto sobre glóbulos rojos.\n\nAgonista del «receptor de reparación innata», un heterodímero del receptor de EPO con el receptor beta común (CD131). Ese receptor sólo se expresa en tejido lesionado o inflamado, lo que da selectividad por el sitio de daño. No activa el homodímero EPOR responsable de la eritropoyesis: no aumenta el hematocrito.", "k1": "Tipo", "v1": "Péptido derivado de eritropoyetina, no hematopoyético", "k2": "Fórmula molecular (referencia)", "v2": "C51H84N16O21", "k3": "Peso molecular aprox.", "v3": "1257.3 Da", "k4": "CAS", "v4": "1208243-50-8", "k5": "Secuencia", "v5": "pyroGlu-EQLERALNSS (pyroglutamato N-terminal)", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 10MG", "k7": "Contenido del vial", "v7": "Undecapéptido sintético con pyroglutamato en N, liofilizado, sal de acetato.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Mejora de densidad de fibra nerviosa corneal y de síntomas en neuropatía de fibra pequeña asociada a sarcoidosis (fase 2, humano, n=64).\nReducción de dolor neuropático en diabetes tipo 2 (fase 2, humano).\nAusencia confirmada de efecto sobre hemoglobina y hematocrito en los ensayos humanos — el objetivo de diseño se cumplió.\nSin fase 3 completada; sin aprobación.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática. Soluble.\nEstabilidad: Buena. Sin cisteína ni metionina. El pyroglutamato N-terminal ya está ciclado, lo que bloquea la aminopeptidasa.\nManejo: Manejar como sustancia de investigación no caracterizada.\nVida media: ~2 min en plasma. El efecto es muy superior a la exposición, lo que indica señalización mantenida tras la unión.", "riesgos": "Sin aprobación regulatoria. Designación de medicamento huérfano en EE. UU. y UE para sarcoidosis.\nNo confundir con EPO: no es hematopoyético y no comparte su perfil de riesgo trombótico.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "RA10", "sizes": "10MG", "cas": "1208243-50-8", "cls": "Péptido derivado de eritropoyetina, no hematopoyético", "aka": "Cibinetida, péptido de la hélice B de EPO"}, {"id": "CU", "line": "beauty", "L": "BEAUTY", "ink": "#8a4f2e", "acc": "#c98a63", "name": "GHK-Cu", "sub": "Cobre tripéptido-1, glicil-L-histidil-L-lisina cobre(II)", "strip": "LÍNEA BEAUTY · ELEVATE AESTHETICS", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "El compuesto ancla de la línea BEAUTY. Investigación de remodelado dérmico, síntesis de colágeno y cicatrización.\n\nGHK es un fragmento de la cadena alfa-2 del colágeno tipo I, liberado al degradarse la matriz: funciona como señal endógena de «hay daño aquí». Su afinidad por el cobre(II) es tal que lo captura de la albúmina. El complejo estimula síntesis de colágeno, elastina, proteoglicanos y glicosaminoglicanos, modula MMP y TIMP, y el cobre entregado es cofactor de la lisil-oxidasa que entrecruza el colágeno nuevo.", "k1": "Tipo", "v1": "Complejo tripéptido-cobre", "k2": "Fórmula molecular (referencia)", "v2": "C14H22CuN6O4", "k3": "Peso molecular aprox.", "v3": "401.93 Da", "k4": "CAS", "v4": "89030-95-5 (complejo de cobre); 49557-75-7 (GHK libre)", "k5": "Secuencia", "v5": "Gly-His-Lys, acomplejado con Cu(II) en relación 1:1", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 50MG · 100MG", "k7": "Contenido del vial", "v7": "Complejo azul intenso de tripéptido y cobre(II), liofilizado. El color azul es el propio complejo: un polvo blanco etiquetado GHK-Cu es GHK libre sin cobre, y ése es el modo de fallo más frecuente y más fácil de detectar del catálogo — se ve a simple vista.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Aumento de densidad de colágeno y mejora de firmeza y arrugas en ensayos clínicos dermatológicos (humano, tópico).\nAceleración de cicatrización en úlcera diabética y en herida quirúrgica (humano, tópico).\nEstimulación de folículo piloso y aumento de tamaño de folículo (humano, tópico).\nAnálisis de expresión génica: GHK-Cu modula más de 4000 genes humanos hacia un perfil más juvenil (Pickart et al.).\nLos niveles plasmáticos de GHK descienden de ~200 ng/mL a los 20 años a ~80 ng/mL a los 60.\nLa evidencia sólida es TÓPICA. La vía inyectable no tiene ensayos clínicos equivalentes.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C protegido de la luz. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática. Muy soluble; la solución debe quedar azul clara. Turbidez o precipitado verde indica disociación del cobre.\nEstabilidad: El complejo se disocia a pH ácido y en presencia de quelantes (EDTA, citrato). No mezclar con vitamina C ni con ácidos: el cobre libre resultante es prooxidante y el tripéptido pierde toda su función.\nManejo: Complejo de cobre. Evitar contacto prolongado con piel; el cobre libre es irritante.\nVida media: Corta en plasma. El interés terapéutico es local.", "riesgos": "Aprobado como ingrediente cosmético; NO aprobado para uso inyectable.\nVerificar color azul del liofilizado: es la comprobación de identidad más barata que existe.\nIncompatible con quelantes y con ácido ascórbico.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "CU50 · CU100", "sizes": "50MG · 100MG", "cas": "89030-95-5 (complejo de cobre); 49557-75-7 (GHK libre)", "cls": "Complejo tripéptido-cobre", "aka": "Cobre tripéptido-1, glicil-L-histidil-L-lisina cobre(II)"}, {"id": "AC", "line": "beauty", "L": "BEAUTY", "ink": "#8a4f2e", "acc": "#c98a63", "name": "AHK-Cu", "sub": "Cobre tripéptido-3, alanil-L-histidil-L-lisina cobre(II)", "strip": "LÍNEA BEAUTY · ELEVATE AESTHETICS", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación de folículo piloso y angiogénesis dérmica. Es el análogo de GHK-Cu con la glicina sustituida por alanina.\n\nAnálogo estructural de GHK-Cu con perfil desplazado hacia estimulación de VEGF y de proliferación de papila dérmica. La sustitución Gly→Ala añade un metilo que cambia la afinidad relativa por distintos objetivos.", "k1": "Tipo", "v1": "Complejo tripéptido-cobre", "k2": "Fórmula molecular (referencia)", "v2": "C15H24CuN6O4", "k3": "Peso molecular aprox.", "v3": "415.94 Da", "k4": "CAS", "v4": "148579-77-1 (complejo)", "k5": "Secuencia", "v5": "Ala-His-Lys, acomplejado con Cu(II)", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 20MG · 50MG", "k7": "Contenido del vial", "v7": "Complejo azul de tripéptido y cobre(II), liofilizado. Mismo criterio visual que GHK-Cu: si no es azul, no es el complejo.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Aumento de proliferación de células de papila dérmica y de VEGF in vitro.\nAumento de longitud de tallo piloso en folículo humano cultivado ex vivo.\nUso cosmético establecido en formulaciones capilares.\nBase de evidencia sustancialmente menor que la de GHK-Cu; casi toda in vitro.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C protegido de la luz. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática. Solución azul clara.\nEstabilidad: Mismas incompatibilidades que GHK-Cu: quelantes, pH ácido, ascorbato.\nManejo: Complejo de cobre. Evitar contacto prolongado con piel.\nVida media: Corta.", "riesgos": "Aprobado como ingrediente cosmét nista del receptor de melanocortina 1 (MC1R) en el melanocito, con selectividad razonable. Estimula la síntesis de eumelanina, el pigmento fotoprotector. Las dos sustituciones respecto al α-MSH nativo lo hacen ~1000 veces más potente y mucho más resistente a proteasas.", "k1": "Tipo", "v1": "Análogo lineal de α-MSH", "k2": "Fórmula molecular (referencia)", "v2": "C78H111N21O19", "k3": "Peso molecular aprox.", "v3": "1646.85 Da", "k4": "CAS", "v4": "75921-69-6", "k5": "Secuencia", "v5": "Ac-Ser-Tyr-Ser-Nle-Glu-His-D-Phe-Arg-Trp-Gly-Lys-Pro-Val-NH2", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 10MG", "k7": "Contenido del vial", "v7": "Tridecapéptido sintético con norleucina en posición 4 y D-fenilalanina en 7, liofilizado, sal de acetato.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Aprobado por la EMA (2014) y la FDA (2019) como Scenesse, implante subcutáneo, para prevención de fototoxicidad en protoporfiria eritropoyética.\nAumento de densidad de melanina y de tolerancia a exposición lumínica (humano, fase 3).\nPerfil de seguridad razonablemente caracterizado en la población de la indicación.\nEl producto aprobado es un implante de liberación lenta, no una inyección diaria.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C protegido de la luz. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática. Soluble.\nEstabilidad: Contiene Trp (fotosensible) y His. La norleucina sustituye a la metionina precisamente para eliminar el sitio oxidable — es un diseño más estable que el α-MSH nativo.\nManejo: Manejar como sustancia de investigación no caracterizada.\nVida media: ~1 h como péptido libre; el implante aprobado libera durante ~2 meses.", "riesgos": "Existe versión aprobada (Scenesse, implante); el material de investigación NO es ese producto.\nLa melanogénesis inducida no sustituye a la vigilancia dermatológica: oscurecer nevos preexistentes onsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "ET10 · ET50", "sizes": "10MG · 50MG", "cas": "307297-39-8", "cls": "Tetrapéptido bioregulador (escuela de Khavinson)", "aka": "Epitalón, Epithalamin, AEDG"}, {"id": "NJ", "line": "longevity", "L": "LONGEVITY", "ink": "#023473", "acc": "#4a6fa5", "name": "NAD+", "sub": "Nicotinamida adenina dinucleótido", "strip": "LÍNEA LONGEVITY · EXTEND POSSIBILITY", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación de metabolismo energético y de longevidad. Es el sustrato obligado de las sirtuinas y de las PARP.\n\nAcarreador central de electrones de la glucólisis, el ciclo de Krebs y la beta-oxidación. Además es sustrato consumible —no cofactor reciclado— de las sirtuinas (SIRT1-7), de las PARP de reparación de ADN y de la CD38. Los niveles tisulares descienden con la edad, en buena medida por aumento de la actividad de CD38.", "k1": "Tipo", "v1": "Coenzima de dinucleótido (no es un péptido)", "k2": "Fórmula molecular (referencia)", "v2": "C21H27N7O14P2", "k3": "Peso molecular aprox.", "v3": "663.43 Da", "k4": "CAS", "v4": "53-84-9", "k5": "Secuencia", "v5": "No aplica. Dinucleótido de nicotinamida y adenina unidos por un puente pirofosfato.", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 100MG · 500MG · 1000MG", "k7": "Contenido del vial", "v7": "Coenzima en forma oxidada (NAD+), liofilizada. Higroscópica. Las presentaciones de 500 y 1000 MG reflejan que el uso investigado es de escala de cientos de miligramos.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "El descenso de NAD+ con la edad está bien documentado en múltiples tejidos y especies.\nRestauración de función mitocondrial y de capacidad de ejercicio en ratón envejecido mediante precursores (NR, NMN).\nEnsayos humanos con precursores orales elevan NAD+ sanguíneo de forma consistente, pero los resultados funcionales han sido en general modestos o nulos.\nLa molécula de NAD+ intacta es demasiado grande y polar para atravesar bien la membrana celular: la mayoría de la investigación seria usa precursores (nicotinamida ribósido, NMN), no NAD+ directo. Éste es el punto técnico más importante de la ficha.\nLa infusión intravenosa de NAD+ es una práctica de clínica privada sin ensayos controlados que la respalden.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C, sellado y seco. Muy higroscópico. Reconstituido: 2–8 °C, uso a corto plazo.\nReconstitución: Agua bacteriostática o agua estéril. Muy soluble. La solución debe ser incolora o levemente amarilla.\nEstabilidad: Inestable en solución, y particularmente a pH alcalino, donde se degrada en horas. El enlace pirofosfato es el punto lábil. Amarilleamiento marcado indica degradación avanzada.\nManejo: Riesgo bajo.\nVida media: Corta en circulación; se degrada rápidamente a nicotinamida por NAD-glicohidrolasas.", "riesgos": "Sin aprobación regulatoria para uso parenteral.\nBiodisponibilidad celular pobre de la molécula intacta comparada con sus precursores.\nNo es un péptido: requiere métodos analíticos propios (HPLC de intercambio iónico o fase reversa con par iónico).", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "NJ100 · NJ500 · NJ100  "≥98% (HPLC, referencia de catálogo)", "benef": "Reducción de marcadores de senescencia, restauración de densidad de pelaje, de función renal y de resistencia al ejercicio en ratón envejecido y en ratón progeroide XpdTTD (Baar et al., Cell 2017). Es el estudio fundacional.\nEliminación selectiva de condrocitos senescentes en cultivo humano expandido in vitro.\nNO existen ensayos clínicos en humano. Ninguno.\nEl mecanismo es proapoptótico: la selectividad depende por completo de que la célula sana no dependa del secuestro FOXO4-p53, lo cual es cierto en los modelos estudiados pero no ha sido verificado en humano.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C. Reconstituido: 2–8 °C, uso a corto plazo.\nReconstitución: Agua bacteriostática o solución salina. Soluble.\nEstabilidad: Excepcional frente a degradación enzimática, por construcción.\nManejo: Péptido proapoptótico. Manejar con guantes y evitar aerosoles. Desechar como residuo químico.\nVida media: Prolongada respecto a un péptido L equivalente por la resistencia a proteasas; no caracterizada en humano.", "riesgos": "Sin aprobación regulatoria. Sin ningún dato en humano.\nMecanismo proapoptótico: la selectividad no está verificada en humano.\nEs el compuesto del catálogo con la mayor distancia entre entusiasmo de mercado y evidencia disponible.\nUn péptido de D-aminoácidos exige confirmación de configuración: la HPLC quiral o el análisis de aminoácidos tras hidrólisis son los únicos métodos que distinguen D de L. Un CoA que sólo reporte masa y pureza NO demuestra que el material sea retro-inverso.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequenc  sintético liofilizado, sal de acetato. Es el fragmento 4-7 de la ACTH (MEHF) extendido con Pro-Gly-Pro.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Registrado en Rusia desde 1996 para ictus isquémico, encefalopatía y neuropatía óptica.\nMejora de recuperación funcional tras ictus isquémico en ensayos rusos.\nAumento sostenido de BDNF en hipocampo tras administración intranasal (rata).\nEfecto nootrópico en sujetos sanos descrito en estudios pequeños.\nLos ensayos son rusos y no han sido replicados según estándares occidentales.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C protegido de la luz y del aire. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática. Soluble.\nEstabilidad: La metionina N-terminal es oxidable: es la ruta de degradación principal y añade +16 Da visible en LC-MS. La histidina también es susceptible. Proteger de aire y de metales traza.\nManejo: Manejar como sustancia de investigación no caracterizada.\nVida media: Corta como péptido libre; la vía intranasal es la habitual y la que se corresponde con la literatura.", "riesgos": "Registrado únicamente en Rusia. Sin aprobación FDA/EMA.\nOxidación de metionina: exigir en el CoA que la impureza +16 Da esté cuantificada, no sólo la pureza global.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "SX5 · SX10", "sizes": "5MG · 10MG", "cas": "80714-61-0", "cls": "Análogo sintético de ACTH(4-10)", "aka": "Semaks, ACTH(4-10) Pro-Gly-Pro"}, {"id": "ML", "line": "longevity", "L": "LONGEVITY", "ink": "#023473", "acc": "#4a6fa5", "name": "Melatonin", "sub": "Melatonina, N-acetil-5-metoxitriptamina", "strip": "LÍNEA LONGEVITY · EXTEND POSSIBILITY", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Hormona pineal del ritmo circadiano. Es el compuesto con historial de uso humano más amplio del catálogo.\n\nAgonista de los receptores MT1 y MT2 en el núcleo supraquiasmático, el marcapasos circadiano. MT1 media la reducción del disparo neuronal que promueve el sueño; MT2 media el desplazamiento de fase. Es además un captador directo de radicales libres y ese efecto antioxidante es independiente del receptor.", "k1": "Tipo", "v1": "Indolamina hormonal (no es un péptido)", "k2": "Fórmula molecular (referencia)", "v2": "C13H16N2O2", "k3": "Peso molecular aprox.", "v3": "232.28 Da", "k4": "CAS", "v4": "73-31-4", "k5": "Secuencia", "v5": "No aplica. Derivado indólico del triptófano.", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 10MG", "k7": "Contenido del vial", "v7": "Indolamina sintética en polvo. Molécula pequeña (232 Da), no un péptido.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Reducción de latencia de sueño de ~7 min y aumento de duración total de ~8 min frente a placebo en metaanálisis: efecto real, consistente y de magnitud modesta. La expectativa del público suele exceder con mucho esta cifra.\nEficacia clara en desórdenes de fase circadiana: jet lag, trabajo por turnos, síndrome de fase retrasada. Ahí el efecto es sustancialmente mayor que en insomnio primario.\nEl momento de administración importa más que la dosis: es un cronobiótico, no un hipnótico.\nEfecto antioxidante y de protección mitocondrial documentado en modelos preclínicos a dosis muy superiores a las circadianas.\nDe venta libre como suplemento en EE. UU.; medicamento de prescripción en la UE, Reino Unido, Australia y Japón.", "dosis": "", "recom": "Almacenamiento: Polvo: −20 °C protegido de la luz. Marcadamente fotosensible.\nReconstitución: Poco soluble en agua. Requiere etanol, DMSO o ciclodextrina como codisolvente.\nEstabilidad: Buena como sólido seco y oscuro. El anillo indólico se degrada con la luz y con la oxidación.\nManejo: Riesgo bajo.\nVida media: ~40–60 min. Corta, lo que explica el diseño de formulaciones de liberación prolongada.", "riesgos": "Estatus regulatorio variable por país: suplemento en EE. UU., medicamento de prescripción en la UE y otros.\nNo es un péptido: métodos analíticos propios.\nSolubilidad acuosa limitada: es intrínseco a la molécula.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "Melatonin", "sizes": "10MG", "cas": "73-31-4", "cls": "Indolamina hormonal (no es un péptido)", "aka": "Melatonina, N-acetil-5-metoxitriptamina"}, {"id": "KS", "line": "longevity", "L": "LONGEVITY", "ink": "#023473", "acc": "#4a6fa5", "name": "KissPeptin-10", "sub": "Kisspeptina-10, metastina 45-54, KP-10", "strip": "LÍNEA LONGEVITY · EXTEND POSSIBILITY", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Investigación del eje hipotálamo-hipófisis-gónada. Es el regulador maestro de la pubertad y de la reproducción, descubierto en 2003.\n\nAgonista del receptor KISS1R (GPR54) en las neuronas GnRH del hipotálamo. Es el disparador obligado de la secreción pulsátil de GnRH: sin señalización kisspeptina no hay pubertad, y las mutaciones de KISS1R causan hipogonadismo hipogonadotropo congénito. Aguas abajo eleva LH y FSH, y con ellas testosterona o estradiol.", "k1": "Tipo", "v1": "Decapéptido hipotalámico regulador del eje reproductivo", "k2": "Fórmula molecular (referencia)", "v2": "C63H83N17O14", "k3": "Peso molecular aprox.", "v3": "1302.45 Da", "k4": "CAS", "v4": "374675-21-5", "k5": "Secuencia", "v5": "Tyr-Asn-Trp-Asn-Ser-Phe-Gly-Leu-Arg-Phe-NH2", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 5MG · 10MG", "k7": "Contenido del vial", "v7": "Decapéptido sintético amidado, liofilizado, sal de acetato. Es el fragmento activo mínimo de la kisspeptina-54.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Elevación robusta y reproducible de LH y de testosterona en varón sano (humano, fase 1, Imperial College London).\nUsada como disparador de maduración ovocitaria en FIV, con menor riesgo de síndrome de hiperestimulación ovárica que hCG (humano, fase 2). Es su aplicación clínica más prometedora.\nInvestigada en amenorrea hipotalámica y en trastornos del deseo sexual.\nTaquifilaxia documentada: la administración continua desensibiliza el receptor y SUPRIME el eje en lugar de estimularlo — exactamente el mismo fenómeno que hace que los agonistas de GnRH se usen para castración química. La pauta pulsátil frente a la continua no es un detalle, es la diferencia entre estimular y suprimir.\nSin aprobación en ninguna jurisdicción.", "dosis": "", "recom": "Almacenamiento: Liofilizado: −20 °C protegido de la luz. Reconstituido: 2–8 °C, 20–30 días.\nReconstitución: Agua bacteriostática. Soluble.\nEstabilidad: Contiene Trp (fotosensible) y dos Asn (desamidables). Estabilidad media.\nManejo: Manejar como sustancia de investigación no caracterizada.\nVida media: ~4 min. Extremadamente corta: es un péptido de señalización pulsátil por diseño.", "riesgos": "Sin aprobación regulatoria.\nTaquifilaxia: la exposición continua suprime el eje reproductivo en lugar de estimularlo.\nActúa sobre el eje reproductivo completo: la exposición inadvertida tiene consecuencias endocrinas reales.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "KS5 · KS10", "sizes": "5MG · 10MG", "cas": "374675-21-5", "cls": "Decapéptido hipotalámico regulador del eje reproductivo", "aka": "Kisspeptina-10, metastina 45-54, KP-10"}, {"id": "B12", "line": "longevity", "L": "LONGEVITY", "ink": "#023473", "acc": "#4a6fa5", "name": "Vitamin B12", "sub": "Cianocobalamina, metilcobalamina, hidroxocobalamina", "strip": "LÍNEA LONGEVITY · EXTEND POSSIBILITY", "s1": "DESCRIPCIÓN GENERAL", "s2": "COMPOSICIÓN / CONTENIDO QUÍMICO", "s3": "APLICACIONES Y BENEFICIOS EN USO HUMANO", "s4": "DOSIS Y FRECUENCIA DE USO", "s5": "RECOMENDACIONES", "s6": "EFECTOS SECUNDARIOS Y RIESGOS", "desc": "Vitamina esencial. Cofactor de la metionina sintasa y de la metilmalonil-CoA mutasa.\n\nCofactor de dos enzimas humanas. La metionina sintasa remetila homocisteína a metionina (interfaz con folato y con el ciclo de metilación); la metilmalonil-CoA mutasa procesa propionil-CoA en mitocondria. La deficiencia produce anemia megaloblástica y degeneración combinada subaguda de la médula espinal, que es irreversible si se retrasa el tratamiento.", "k1": "Tipo", "v1": "Vitamina — complejo de coordinación de cobalto (no es un péptido)", "k2": "Fórmula molecular (referencia)", "v2": "C63H88CoN14O14P", "k3": "Peso molecular aprox.", "v3": "1355.37 Da", "k4": "CAS", "v4": "68-19-9 (cianocobalamina)", "k5": "Secuencia", "v5": "No aplica. Corrinoide con cobalto central.", "k6": "Presentación en investigación", "v6": "Liofilizado (polvo), vial de laboratorio — 1MG", "k7": "Contenido del vial", "v7": "Cobalamina en una de sus formas: ciano, metil o hidroxo. La forma importa: la cianocobalamina es la más estable y barata pero requiere conversión metabólica; la metilcobalamina es la forma coenzimática directa; la hidroxocobalamina tiene la retención tisular más prolongada. El CoA debe indicar cuál contiene el vial.", "k8": "Pureza reportada (proveedores RUO)", "v8": "≥98% (HPLC, referencia de catálogo)", "benef": "Farmacología y clínica completamente establecidas. Aprobada por la FDA para deficiencia de B12 y anemia perniciosa.\nLa corrección de la deficiencia es inequívocamente eficaz. La suplementación en sujetos con niveles normales no mejora energía, cognición ni rendimiento (metaanálisis).\nLa hidroxocobalamina en dosis alta es antídoto aprobado para intoxicación por cianuro.\nToxicidad prácticamente nula: el exceso se elimina por orina. No se ha establecido nivel superior de ingesta tolerable.", "dosis": "", "recom": "Almacenamiento: 2–8 °C protegido de la luz. MARCADAMENTE fotosensible: la degradación por luz es rápida y visible como pérdida del color rojo.\nReconstitución: Muy soluble. La solución es de un rojo intenso característico.\nEstabilidad: Buena en oscuridad y a pH neutro. Se degrada con luz, con ácido ascórbico y a pH extremo.\nManejo: Riesgo muy bajo.\nVida media: Depende de la forma y de la unión a transcobalamina; las reservas hepáticas duran años.", "riesgos": "Existe versión aprobada por FDA; el material de investigación NO es ese producto.\nFotosensibilidad extrema: la pérdida de color rojo es un indicador visual directo de degradación.\nNo es un péptido.", "legal": "Regulatory Notice & Legal Disclaimer: All compounds provided by PeptideX are sold for laboratory research and analytical reference use only (RUO). By purchasing this material, the buyer assumes absolute, sole, and unconditional liability for any handling, storage, application, or misuse of the product. PeptideX disclaims any and all responsibility for damages, adverse effects, or consequences resulting from any use outside of strictly controlled research protocols by professionals.", "skus": "B12", "sizes": "1MG", "cas": "68-19-9 (cianocobalamina)", "cls": "Vitamina — complejo de coordinación de cobalto (no es un péptido)", "aka": "Cianocobalamina, metilcobalamina, hidroxocobalamina"}];

var TINT  = {fitness:'#1b1b1b', beauty:'#8a4f2e', longevity:'#023473'};
var LNAME = {fitness:'FITNESS', beauty:'BEAUTY', longevity:'LONGEVITY'};

var col   = document.getElementById('col'),
    rail  = document.getElementById('rail'),
    empty = document.getElementById('empty'),
    q     = document.getElementById('q'),
    saved = document.getElementById('saved');

var docs = [], line = 'all', term = '';

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(v){ return String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function orig(id){
  for(var i=0;i<ORIGINAL.length;i++) if(ORIGINAL[i].id===id) return ORIGINAL[i];
  return null;
}

/* ---------- persistencia ---------- */
var saveT=null;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(docs)); }catch(e){}
  saved.textContent='Guardado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function queueSave(){ clearTimeout(saveT); saveT=setTimeout(save,500); }
function load(){
  try{
    var raw=localStorage.getItem(KEY); if(!raw) return false;
    var d=JSON.parse(raw);
    if(!Array.isArray(d)||!d.length) return false;
    docs=d; return true;
  }catch(e){ return false; }
}

/* ---------- campos ----------
   Un textarea que crece con su contenido.  Se pone a 'auto' antes de medir
   porque el scrollHeight de un textarea ya encogido nunca reporta menos de su
   altura actual: sin ese reset el campo crece pero jamás vuelve a bajar. */
function grow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }

function fld(cls, k, ph){
  return '<textarea class="f '+cls+'" data-k="'+k+'" rows="1" placeholder="'+esc(ph||'')+'"></textarea>'+
         '<div class="m m-'+cls.slice(2)+'"></div>';
}
function fldList(cls, k, ph){
  return '<div class="lw">'+
           '<textarea class="f '+cls+'" data-k="'+k+'" data-list="1" rows="1"></textarea>'+
           '<div class="m m-list" data-ph="'+esc(ph||'')+'"></div>'+
           '<span class="hint">una línea = una viñeta</span>'+
         '</div>';
}

/* El espejo: el div que se imprime en lugar del textarea.  Un div se
   dimensiona solo a cualquier ancho, así que no pierde texto al reflujo. */
function sync(t){
  var m=t.nextElementSibling;
  if(!m || m.className.indexOf('m ')!==0) m=t.parentNode.querySelector('.m');
  if(!m) return;
  if(t.dataset.list){
    var ls=t.value.split('\n').filter(function(x){ return x.trim(); });
    m.innerHTML = ls.length
      ? '<ul>'+ls.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>' : '';
  }else{
    m.textContent=t.value;
  }
}

function bind(node, d){
  var tas=node.querySelectorAll('textarea.f');
  for(var i=0;i<tas.length;i++){
    (function(t){
      t.value = d[t.dataset.k] || '';
      grow(t); sync(t);
      t.addEventListener('input', function(){
        d[t.dataset.k]=t.value; grow(t); sync(t);
        d.edited=true; node.classList.add('dirty');
        if(t.dataset.k==='name'){
          var a=railItem(d.id);
          if(a){ a.querySelector('.nname').textContent=t.value; a.querySelector('.nsz').textContent='•'; }
        }
        queueSave();
      });
      var lw=t.closest('.lw');
      if(lw){
        lw.addEventListener('mousedown', function(ev){
          if(lw.classList.contains('on')) return;
          ev.preventDefault();
          lw.classList.add('on'); grow(t); t.focus();
        });
        t.addEventListener('blur', function(){ lw.classList.remove('on'); sync(t); });
      }
      /* Esc devuelve ESTE campo a su valor original, sin tocar el resto de la
         ficha.  Es el deshacer que se necesita nueve de cada diez veces. */
      t.addEventListener('keydown', function(ev){
        if(ev.key!=='Escape') return;
        var o=orig(d.id); if(!o || o[t.dataset.k]===undefined) return;
        ev.preventDefault();
        t.value=o[t.dataset.k]; d[t.dataset.k]=t.value; grow(t); sync(t); queueSave();
      });
    })(tas[i]);
  }
  var sel=node.querySelector('.lsel');
  if(sel){
    sel.value=d.line;
    sel.addEventListener('change', function(){
      d.line=sel.value; d.L=LNAME[d.line];
      node.dataset.line=d.line;
      node.querySelector('.fx-linelogo').src=LOGO[d.line];
      d.edited=true; node.classList.add('dirty');
      save(); buildRail(); apply();
    });
  }
}

/* --- una fila de la tabla de composición: rótulo y valor, ambos editables --- */
function trow(kk, vk){
  return '<tr><td class="kk">'+fld('f-cellk',kk,'Parámetro')+'</td>'+
             '<td>'+fld('f-cell',vk,'—')+'</td></tr>';
}
function sec(n, k){
  return '<div class="fx-sec"><span class="fx-n">'+n+'</span>'+fld('f-sect',k,'Título de sección')+'</div>';
}

function fichaNode(d, n){
  var art=document.createElement('article');
  art.className='ficha'+(d.edited?' dirty':'');
  art.id='f-'+d.id;
  art.dataset.line=d.line;
  art.innerHTML =
  '<span class="badge">editada</span>'+
  '<div class="fx-tools">'+
    '<select class="lsel">'+
      '<option value="fitness">FITNESS</option>'+
      '<option value="beauty">BEAUTY</option>'+
      '<option value="longevity">LONGEVITY</option></select>'+
    '<button class="fbtn rest">Restaurar</button>'+
    '<button class="fbtn del">Eliminar</button>'+
  '</div>'+

  '<div class="fx-head">'+
    '<img class="fx-master" src="'+MASTER+'" alt="PEPTIDEX"/>'+
    '<div class="fx-kick">Ficha Técnica</div>'+
    fld('f-name','name','Nombre del compuesto')+
    fld('f-sub','sub','Subtítulo')+
    '<div class="fx-ruo">RUO · RESEARCH USE ONLY</div>'+
    '<div class="fx-strip">'+
      '<img class="fx-linelogo" src="'+(LOGO[d.line]||LOGO.fitness)+'" alt=""/>'+
      '<div>'+fld('f-strip','strip','Línea')+'</div>'+
    '</div>'+
  '</div>'+

  sec(1,'s1')+ '<div>'+fld('f-body','desc','—')+'</div>'+

  sec(2,'s2')+
  '<table class="fx-tab"><tbody>'+
    trow('k1','v1')+trow('k2','v2')+trow('k3','v3')+trow('k4','v4')+
    trow('k5','v5')+trow('k6','v6')+trow('k7','v7')+trow('k8','v8')+
  '</tbody></table>'+

  sec(3,'s3')+ '<div class="fx-ul">'+fldList('f-list','benef','—')+'</div>'+

  /* La sección 4 nace vacía a propósito: el recuadro punteado es el hueco
     donde el usuario escribe su pauta.  El generador no propone ninguna. */
  sec(4,'s4')+ '<div class="fx-ul fx-blank">'+
    fldList('f-list','dosis','Escribe aquí la dosis y la frecuencia — una línea por viñeta')+'</div>'+

  sec(5,'s5')+ '<div class="fx-ul">'+fldList('f-list','recom','—')+'</div>'+

  sec(6,'s6')+ '<div class="fx-ul">'+fldList('f-list','riesgos','—')+'</div>'+

  '<div class="fx-legal">'+fld('f-legal','legal','Aviso legal')+'</div>';

  bind(art, d);
  art.querySelector('.rest').addEventListener('click', function(){ restore(d); });
  art.querySelector('.del').addEventListener('click', function(){ remove(d); });
  return art;
}

/* ---------- índice ---------- */
function railItem(id){
  var as=rail.querySelectorAll('.ni');
  for(var i=0;i<as.length;i++) if(as[i].getAttribute('data-id')===id) return as[i];
  return null;
}
function buildRail(){
  var groups={fitness:[],beauty:[],longevity:[]}, n=0;
  docs.forEach(function(d){ n++; (groups[d.line]||groups.fitness).push([d,n]); });
  var h='';
  ['fitness','beauty','longevity'].forEach(function(k){
    if(!groups[k].length) return;
    h+='<div class="ng" data-line="'+k+'"><span class="ngt" style="color:'+TINT[k]+'">'+LNAME[k]+'</span>';
    groups[k].forEach(function(p){
      var d=p[0];
      h+='<a class="ni" href="#f-'+esc(d.id)+'" data-id="'+esc(d.id)+'" data-line="'+k+'">'+
         '<span class="nn">'+(p[1]<10?'0':'')+p[1]+'</span>'+
         '<span class="nname">'+esc(d.name)+'</span>'+
         '<span class="nsz">'+(d.edited?'•':'')+'</span></a>';
    });
    h+='</div>';
  });
  rail.innerHTML=h;
}

/* ---------- render ---------- */
function render(){
  var frag=document.createDocumentFragment();
  docs.forEach(function(d,i){ frag.appendChild(fichaNode(d,i+1)); });
  col.innerHTML=''; col.appendChild(frag); col.appendChild(empty);
  buildRail(); apply(); observe();
  /* Los campos se miden AQUÍ y no en bind(): dentro de un DocumentFragment no
     hay layout, y el scrollHeight de un elemento sin caja es cero — todos los
     textarea nacían con altura 0 y la ficha salía en blanco.  Sólo una vez
     montados en el documento se puede saber cuánto miden. */
  growAll();
}
function growAll(){
  /* Los campos de lista viven ocultos tras su espejo; medirlos ahí daría cero.
     Se miden cuando se abren. */
  [].forEach.call(col.querySelectorAll('textarea.f'), function(t){
    if(!t.closest('.lw')) grow(t);
  });
}

function qtext(d){
  return (d.name+' '+d.sub+' '+d.v1+' '+d.v4+' '+d.skus+' '+d.sizes).toLowerCase();
}
function apply(){
  var shown=0;
  docs.forEach(function(d){
    var el=document.getElementById('f-'+d.id); if(!el) return;
    var ok=(line==='all'||d.line===line) && (!term||qtext(d).indexOf(term)>=0);
    el.style.display=ok?'':'none'; if(ok)shown++;
    var a=railItem(d.id); if(a) a.style.display=ok?'':'none';
  });
  [].forEach.call(rail.querySelectorAll('.ng'), function(g){
    var any=[].some.call(g.querySelectorAll('.ni'), function(i){ return i.style.display!=='none'; });
    g.style.display=any?'':'none';
  });
  empty.style.display=shown?'none':'block';
  /* Una ficha oculta no tiene caja: si estaba en display:none cuando se midió,
     su altura quedó en cero.  Al volver a mostrarla se remide. */
  if(typeof growAll==='function') growAll();
}

/* ---------- acciones ---------- */
function restore(d){
  var o=orig(d.id);
  if(!o){ alert('Esta ficha se añadió a mano: no tiene original al que volver. Usa Eliminar.'); return; }
  if(!confirm('Devolver «'+d.name+'» a su contenido original.\nSe pierden los cambios de esta ficha, incluida la dosis que hayas escrito.')) return;
  var i=docs.indexOf(d); docs[i]=clone(o);
  save(); render();
  var el=document.getElementById('f-'+docs[i].id);
  if(el) el.scrollIntoView({block:'center'});
}
function remove(d){
  if(!confirm('Eliminar «'+d.name+'» del documento. ¿Continuar?')) return;
  docs.splice(docs.indexOf(d),1); save(); render();
}
document.getElementById('add').addEventListener('click', function(){
  var id='NEW'+Date.now().toString(36);
  var base=clone(ORIGINAL[0]);
  for(var k in base) if(typeof base[k]==='string') base[k]='';
  base.id=id; base.line='fitness'; base.L='FITNESS'; base.edited=true;
  base.name='COMPUESTO NUEVO';
  base.strip=ORIGINAL[0].strip; base.legal=ORIGINAL[0].legal;
  ['s1','s2','s3','s4','s5','s6','k1','k2','k3','k4','k5','k6','k7','k8'].forEach(function(k){
    base[k]=ORIGINAL[0][k];
  });
  docs.push(base); save(); render();
  var el=document.getElementById('f-'+id);
  if(el){ el.scrollIntoView({block:'center'}); el.querySelector('textarea').focus(); }
});
document.getElementById('rst').addEventListener('click', function(){
  if(!confirm('Devolver las '+ORIGINAL.length+' fichas a su contenido original.\n'+
              'Se pierden todos los cambios, las dosis escritas y las fichas añadidas a mano. ¿Continuar?')) return;
  docs=clone(ORIGINAL); save(); render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('exp').addEventListener('click', function(){
  var b=new Blob([JSON.stringify(docs,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='PEPTIDEX_Fichas_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
});
var file=document.getElementById('file');
document.getElementById('imp').addEventListener('click', function(){ file.click(); });
file.addEventListener('change', function(){
  var f=file.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!Array.isArray(d)||!d.length) throw new Error('el archivo no contiene una lista de fichas');
      docs=d; save(); render(); window.scrollTo({top:0});
      alert('Importadas '+d.length+' fichas.');
    }catch(e){ alert('No se pudo leer el archivo: '+e.message); }
    file.value='';
  };
  r.readAsText(f);
});

/* Los espejos se remiden justo antes de imprimir: si se cambió el zoom o el
   ancho de la ventana, el div ya no coincide con lo que hay en el textarea. */
function syncAll(){ [].forEach.call(document.querySelectorAll('textarea.f'), sync); }

/* Alto útil de una hoja Carta con los márgenes de @page, a 96 dpi:
   (11in − 10mm − 8mm) × 96 ≈ 988 px.  Es el número contra el que se decide si
   una ficha cabe. */
var PAGE_PX = 988;
function fit(){
  var fs=[].slice.call(col.querySelectorAll('.ficha'));
  fs.forEach(function(f){ f.classList.remove('tight','tighter'); });
  fs.forEach(function(f){
    if(f.style.display==='none') return;
    if(f.getBoundingClientRect().height<=PAGE_PX) return;
    f.classList.add('tight');
    if(f.getBoundingClientRect().height>PAGE_PX){
      f.classList.remove('tight'); f.classList.add('tighter');
    }
  });
}
window.PX_FIT = fit;
document.getElementById('pr').addEventListener('click', function(){ syncAll(); window.print(); });
/* beforeprint se dispara con los estilos de impresión ya aplicados, que es el
   único momento en que medir tiene sentido. */
window.addEventListener('beforeprint', function(){ syncAll(); fit(); });
if(window.matchMedia){
  var mq=window.matchMedia('print');
  var onmq=function(e){ if(e.matches){ syncAll(); fit(); } };
  if(mq.addEventListener) mq.addEventListener('change',onmq);
  else if(mq.addListener) mq.addListener(onmq);
}
window.addEventListener('resize', function(){
  [].forEach.call(document.querySelectorAll('textarea.f'), grow);
});

/* ---------- búsqueda y filtros ---------- */
q.addEventListener('input', function(){ term=q.value.trim().toLowerCase(); apply(); });
var btns=[].slice.call(document.querySelectorAll('.filters button'));
btns.forEach(function(b){
  b.addEventListener('click', function(){
    btns.forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on');
    line=b.dataset.f; apply(); window.scrollTo({top:0,behavior:'smooth'});
  });
});
document.addEventListener('keydown', function(ev){
  if((ev.metaKey||ev.ctrlKey)&&ev.key==='k'){ ev.preventDefault(); q.focus(); q.select(); }
});

/* El índice sigue a la lectura.  El margen recorta el viewport a una banda
   estrecha bajo la cabecera: la ficha activa es la que cruza esa banda, no la
   que ocupa más pantalla, así el resaltado cambia cuando entra el título. */
var io=null;
function observe(){
  if(!('IntersectionObserver' in window)) return;
  if(io) io.disconnect();
  io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(!en.isIntersecting) return;
      var a=railItem(en.target.id.slice(2)); if(!a) return;
      [].forEach.call(rail.querySelectorAll('.ni'), function(x){ x.classList.remove('act'); });
      a.classList.add('act');
      var r=a.getBoundingClientRect(), rr=rail.getBoundingClientRect();
      if(r.top<rr.top+10||r.bottom>rr.bottom-10) rail.scrollTop+=r.top-rr.top-rr.height/2;
    });
  },{rootMargin:'-68px 0px -78% 0px'});
  [].forEach.call(col.querySelectorAll('.ficha'), function(f){ io.observe(f); });
}

/* ---------- arranque ---------- */
if(!load()) docs=clone(ORIGINAL);
render();
})();
</script>
