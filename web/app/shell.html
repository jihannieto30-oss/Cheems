<script>
/* EL TEMA SE APLICA ANTES DE PINTAR NADA.

   Si esto se dejara al script del final, la página nace en claro y salta a
   oscuro en cuanto arranca — el destello blanco que delata a las aplicaciones
   que no se lo pensaron. Va aquí, síncrono, en el <head>, antes de que exista
   un solo píxel.

   Tres modos: light, dark y system. El de fábrica es light, como se pidió. */
(function(){
  var m = 'light';
  try{ m = JSON.parse(localStorage.getItem('pepx-app-v3')||'{}').theme || 'light'; }catch(e){}
  var dark = m === 'dark' ||
    (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.mode = m;
})();
</script>
